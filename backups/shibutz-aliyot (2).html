function defaultSplit(total){
  let base = Math.floor(total/7), rem = total % 7;
  let arr = new Array(7).fill(base);
  for(let i=0;i<rem;i++) arr[6-i]+=1;
  for(let i=0;i<7;i++) if(arr[i]<3) arr[i]=3;
  return arr;
}

// ---------- state ----------
let STATE = {
  tab:'assign',
  congregants:[],   // {id, name, level, baseTotal}
  weeklyLog:[],     // {id, date:"YYYY-MM-DD", parasha, assign:{"1":congId,...}, deferred:[ids]}
  parashot:{},      // name -> [7 nums] (manual overrides)
  current:null,     // draft: {date, parasha, assign:{}, deferred:[], confirmed:false}
  loaded:false,
  editingCongregant:null,

  pendingParasha:null,   // ephemeral: what's picked in the selector before START is pressed
  pendingDate:null,      // ephemeral: manual date fallback when the calendar library can't load
  manualWeekDraft:null,  // {parasha, date, assign} while backfilling a past week
  peopleSortMode:'name', // 'name' | 'stale' (longest since last read first)
  pendingLocks:{},        // aliyahNum -> congId, set before START to pre-lock specific aliyot

  noticeModal:null,      // message - in-app replacement for window.alert()
  editingWeekId:null,     // id of the one confirmed week currently unlocked for editing (recent tab)
  printModal:null,        // HTML content while the print-preview modal is open
  suggestedParasha:null,  // {name, date} computed for the upcoming Shabbat
  parashaCalendar:[],     // full lookahead list of {name, date} for the next ~14 months
  calendarStatus:'loading' // 'loading' | 'ok' | 'error'
};

// ---------- date helpers ----------
function nextSaturdayISO(){
  const d = new Date();
  const day = d.getDay();
  const diff = (6 - day + 7) % 7;
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function formatDate(iso){
  if(!iso) return '';
  const parts = iso.split('-');
  if(parts.length!==3) return iso;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}
function genId(){ return 'w'+Math.random().toString(36).slice(2,9); }

// normalizes an Israeli-style local number (05X-XXXXXXX) or an already-international one
// into the digits-only format wa.me expects (country code, no + or leading 0)
function phoneToWhatsappDigits(phone){
  let digits = (phone||'').replace(/\D/g,'');
  if(!digits) return '';
  if(digits.startsWith('0')) digits = '972' + digits.slice(1);
  return digits;
}
const DEFAULT_WHATSAPP_TEMPLATE = 'שלום {שם}, אתה משובץ השבת לעלייה {עלייה} בפרשת {פרשה}. שבת שלום!';
function whatsappLinkForPerson(person, parashaName, aliyahName){
  const digits = phoneToWhatsappDigits(person.phone);
  if(!digits) return null;
  const template = STATE.whatsappTemplate || DEFAULT_WHATSAPP_TEMPLATE;
  const message = template
    .replace(/\{שם\}/g, person.name)
    .replace(/\{עלייה\}/g, aliyahName)
    .replace(/\{פרשה\}/g, parashaName);
  return `https://wa.me/${digits}?text=${encodeURIComponent(message)}`;
}

// ---------- storage abstraction ----------
// Uses window.storage when running inside a Claude artifact (this conversation, for testing).
// Falls back to the browser's own localStorage when window.storage isn't available - which is
// what will actually run once this file is hosted on its own (e.g. GitHub Pages/Netlify) and
// opened directly in a regular browser. Same key names either way, so nothing else in the app
// needs to know or care which one is active.
const LS_PREFIX = 'shibutz-aliyot:';
const hasClaudeStorage = (typeof window!=='undefined' && !!window.storage);
const Store = {
  async get(key){
    if(hasClaudeStorage){
      try{ return await window.storage.get(key); }catch(e){ return null; }
    }
    try{
      const raw = localStorage.getItem(LS_PREFIX+key);
      return raw===null ? null : {key, value: raw};
    }catch(e){ return null; }
  },
  async set(key, value){
    if(hasClaudeStorage){
      try{ return await window.storage.set(key, value); }catch(e){ return null; }
    }
    try{
      localStorage.setItem(LS_PREFIX+key, value);
      return {key, value};
    }catch(e){ return null; }
  }
};

// ---------- live Hebrew-calendar lookup ----------
// Computes the parasha for every upcoming Shabbat over the next ~14 months, so we can look up
// the real date for ANY parasha the gabbai picks, not just the very next one.
// Primary method: a plain data fetch to Hebcal's public JSON API (a simple GET request, not a
// script/module load - this is far more likely to be permitted by any sandboxed preview than
// importing an executable library, and is exactly the same request a normal browser would make).
// Secondary fallback: Hebcal's own JS library via CDN, in case the API fetch is unreachable.
// Always uses the Israel reading schedule, per how this shul reads.
async function fetchUpcomingParasha(){
  if(await fetchViaHebcalApi()){ render(); return; }
  if(await fetchViaHebcalLibrary()){ render(); return; }
  STATE.calendarStatus = 'error';
  render();
}

async function fetchViaHebcalApi(){
  try{
    const start = new Date();
    const end = new Date(start); end.setDate(end.getDate()+200);
    const fmt = d => d.toISOString().slice(0,10);
    const url = `https://www.hebcal.com/hebcal?cfg=json&v=1&maj=off&min=off&mod=off&nx=off&mf=off&ss=off&s=on&start=${fmt(start)}&end=${fmt(end)}&i=on`;
    const res = await fetch(url);
    const data = await res.json();
    const calendar = (data.items||[])
      .filter(it=>it.category==='parashat')
      .map(it=>({ name: (it.hebrew||'').replace(/^פרשת\s+/,'').trim(), date: it.date }))
      .filter(c=>c.name);
    if(calendar.length===0) return false;
    STATE.parashaCalendar = calendar;
    STATE.suggestedParasha = calendar[0];
    STATE.calendarStatus = 'ok';
    return true;
  }catch(e){ return false; }
}

async function fetchViaHebcalLibrary(){
  try{
    const { HDate, getSedra, ParshaEvent } = await import('https://cdn.jsdelivr.net/npm/@hebcal/core/+esm');
    let d = new Date();
    const day = d.getDay();
    d.setDate(d.getDate() + ((6 - day + 7) % 7));
    const calendar = [];
    for(let i=0; i<62; i++){
      const hd = new HDate(d);
      const info = getSedra(hd.getFullYear(), true).lookup(hd);
      if(info && !info.chag){
        const ev = new ParshaEvent(info);
        const name = (ev.render('he')||'').replace(/^פרשת\s+/,'').trim();
        calendar.push({ name, date: d.toISOString().slice(0,10) });
      }
      d.setDate(d.getDate()+7);
    }
    if(calendar.length===0) return false;
    STATE.parashaCalendar = calendar;
    STATE.suggestedParasha = calendar[0];
    STATE.calendarStatus = 'ok';
    return true;
  }catch(e){ return false; }
}

// Looks up the real upcoming date for a specific parasha name from the precomputed calendar.
// Falls back to the suggested/next date if the name isn't found within the lookahead window.
function getDateForParasha(name){
  const hit = (STATE.parashaCalendar||[]).find(c=>c.name===name);
  if(hit) return hit.date;
  return STATE.suggestedParasha ? STATE.suggestedParasha.date : nextSaturdayISO();
}

// ---------- backup export/import ----------
function csvEscape(val){
  const s = String(val==null?'':val);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function exportHistoryCsv(){
  const rows = [['תאריך','פרשה','עלייה','מתפלל']];
  const sorted = STATE.weeklyLog.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  for(const w of sorted){
    for(let i=1;i<=7;i++){
      const id = w.assign[i] || w.assign[String(i)];
      if(!id) continue;
      const person = resolvePerson(id);
      rows.push([formatDate(w.date), w.parasha, ALIYAH_NAMES[i-1], person ? person.name : '—']);
    }
  }
  const csv = '\uFEFF' + rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `היסטוריית-עליות-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function getBaselineSplit(name){
  if(PARASHOT_VERIFIED[name]) return PARASHOT_VERIFIED[name];
  const found = PARASHOT_DEFAULT_TOTALS.find(p=>p[0]===name);
  return defaultSplit(found ? found[1] : 105);
}
function arraysEqual(a,b){
  return a.length===b.length && a.every((v,i)=>v===b[i]);
}
function getSplit(name){
  if(STATE.parashot[name]) return STATE.parashot[name];
  return getBaselineSplit(name);
}
function getStatus(name){
  const override = STATE.parashot[name];
  const baseline = getBaselineSplit(name);
  const isRealOverride = override && !arraysEqual(override, baseline);
  if(isRealOverride) return {label:'מותאם ידנית', cls:'pill-gold'};
  if(PARASHOT_VERIFIED[name]) return {label:'מאומת ✓', cls:'pill-good'};
  return {label:'משוער - טרם אומת', cls:'pill-warn'};
}
// describes exactly which aliyot were changed by a manual override, e.g. "א: 34→35"
function getOverrideDiff(name){
  const override = STATE.parashot[name];
  if(!override) return '';
  const baseline = getBaselineSplit(name);
  if(arraysEqual(override, baseline)) return '';
  const parts = [];
  for(let i=0;i<7;i++){
    if(override[i] !== baseline[i]) parts.push(`${HEB_LETTERS[i]}: ${baseline[i]}→${override[i]}`);
  }
  return parts.join(', ');
}

// ---------- derived congregant stats (computed from weeklyLog, never stored redundantly) ----------
function getCongStats(id){
  let entries = [];
  for(const w of STATE.weeklyLog){
    for(const k of Object.keys(w.assign||{})){
      if(w.assign[k]===id) entries.push({date:w.date, parasha:w.parasha, aliyah:parseInt(k), weekId:w.id});
    }
  }
  entries.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  const congregant = STATE.congregants.find(c=>c.id===id);
  const base = congregant ? (congregant.baseTotal||0) : 0;
  return {
    total: base + entries.length,
    lastEntry: entries.length ? entries[entries.length-1] : null,
    history: entries.slice().reverse()
  };
}

// ---------- assignment algorithm ----------
// A person should be matched to an aliyah close to the top of what they can handle -
// not "anything up to their max" (which wastes a strong reader on a tiny aliyah).
// Accepted window: 80%-110% of their stated max pasuk count.
// Resolves an assign-object value to a displayable person. Real congregants are looked up
// normally; a "guest:<name>" value represents a one-off guest reader typed in by the gabbai
// for that specific aliyah - a different person can be named each time, with no pasuk limit.
function resolvePerson(id){
  if(!id) return null;
  if(id.startsWith('guest:')){
    const name = id.slice(6);
    return { id, name: name ? `${name} (אורח)` : 'אורח (ללא שם)', unrestricted:true, isGuest:true, level:0 };
  }
  return STATE.congregants.find(c=>c.id===id) || null;
}

function fits(person, pesukim){
  if(person.unrestricted) return true; // strong reader - no real ceiling, any aliyah is fair game
  const lowerPct = (STATE.matchSettings && STATE.matchSettings.lower) || 80;
  const upperPct = (STATE.matchSettings && STATE.matchSettings.upper) || 110;
  const min = person.level * (lowerPct/100);
  const max = person.level * (upperPct/100);
  return pesukim >= min - 1e-6 && pesukim <= max + 1e-6;
}

function fairnessCompare(a, b){
  const sa = getCongStats(a.id), sb = getCongStats(b.id);
  if(sa.total !== sb.total) return sa.total - sb.total;
  const aNever = sa.lastEntry ? 1:0, bNever = sb.lastEntry ? 1:0;
  if(aNever !== bNever) return aNever - bNever;
  return Math.random() - 0.5;
}

function runAssignment(parashaName, date, locks){
  locks = locks || {};
  const split = getSplit(parashaName);
  let assign = {...locks};
  const lockedCongIds = new Set(Object.values(locks).filter(v=>v && !v.startsWith('guest:')));
  let remaining = split
    .map((p,i)=>({aliyahNum:i+1, pesukim:p}))
    .filter(a=>!assign[a.aliyahNum]);
  remaining.sort((a,b)=> (b.pesukim - a.pesukim) || (Math.random()-0.5)); // hardest first

  const strongPool = STATE.congregants.filter(c=>c.unrestricted && !c.paused && !lockedCongIds.has(c.id)).sort(fairnessCompare);
  const normalPool = STATE.congregants.filter(c=>!c.unrestricted && !c.paused && !lockedCongIds.has(c.id)).sort(fairnessCompare);
  const usedNormal = new Set();
  const usedStrong = new Set();
  let unfilledReasons = {};

  // The hardest aliyah any normal (banded) reader in the community could ever be given -
  // used to tell "too hard for anyone normal, a strong reader is genuinely needed" apart from
  // "just happens to be too short/awkward for whoever's available right now, gabbai should decide".
  const upperPct = (STATE.matchSettings && STATE.matchSettings.upper) || 110;
  const maxNormalCeiling = normalPool.length ? Math.max(...normalPool.map(p=>p.level*(upperPct/100))) : 0;

  // Going hardest aliyah first: give it to a normal (banded) reader ONLY if some normal reader's
  // band actually reaches it. A strong reader only steps in when the aliyah is harder than every
  // normal reader in the community could ever handle - not merely because none happens to fit it
  // this particular week (e.g. a very short aliyah below everyone's floor). In that second case
  // the slot is left unfilled on purpose, for the gabbai to decide manually (a guest, etc.).
  for(const aliyah of remaining){
    const normalMatch = normalPool.find(p=>!usedNormal.has(p.id) && fits(p, aliyah.pesukim));
    if(normalMatch){
      assign[aliyah.aliyahNum] = normalMatch.id;
      usedNormal.add(normalMatch.id);
      continue;
    }
    if(aliyah.pesukim > maxNormalCeiling){
      const strongMatch = strongPool.find(p=>!usedStrong.has(p.id));
      if(strongMatch){
        assign[aliyah.aliyahNum] = strongMatch.id;
        usedStrong.add(strongMatch.id);
        continue;
      }
      unfilledReasons[aliyah.aliyahNum] = 'עלייה זו חורגת מיכולת כל מתפלל רגיל, וכל המתפללים החזקים כבר שובצו לעליות אחרות השבוע - נדרש שיבוץ ידני.';
      continue;
    }
    // not too hard for the community in general - it just doesn't fit anyone available right now
    const someoneCouldEver = normalPool.some(p=>fits(p, aliyah.pesukim));
    unfilledReasons[aliyah.aliyahNum] = someoneCouldEver
      ? 'המתפלל/ים שמתאימים לטווח הזה כבר שובצו השבוע לעליות אחרות - נדרש שיבוץ ידני.'
      : 'אף מתפלל רגיל אינו בטווח היכולת המתאים לכמות פסוקים כזו (ולא הופעל מתפלל חזק, כי היא לא חורגת מיכולת הרגילים) - נדרש שיבוץ ידני.';
  }

  // deferred = normal readers whose band doesn't reach ANY aliyah in this week's parasha at all
  // (not simply "someone else with priority took the one aliyah that also fit them")
  const deferred = normalPool
    .filter(p=>!usedNormal.has(p.id) && !split.some(pesukim=>fits(p, pesukim)))
    .map(p=>p.id);

  STATE.current = { date, parasha: parashaName, assign, deferred, unfilledReasons, confirmed:false };
  saveCurrent();
}

function confirmAssignment(){
  if(!STATE.current) return;
  const entry = {
    id: genId(),
    date: STATE.current.date,
    parasha: STATE.current.parasha,
    assign: {...STATE.current.assign},
    deferred: [...STATE.current.deferred],
    unfilledReasons: {...(STATE.current.unfilledReasons||{})}
  };
  STATE.weeklyLog.push(entry);
  saveWeeklyLog();
  STATE.current = null;
  saveCurrent();
  STATE.tab = 'recent';
  render();
}

// edits a week already saved in the log (works for past confirmed weeks too)
function updateLogAssignment(weekId, aliyahNum, newCongId){
  const entry = STATE.weeklyLog.find(w=>w.id===weekId);
  if(!entry) return;
  if(newCongId) entry.assign[aliyahNum] = newCongId;
  else delete entry.assign[aliyahNum];
  saveWeeklyLog();
  render();
}

// builds the editable 7-aliyah panel strip shared by "assign" (draft) and "recent" (saved weeks)
function buildWeekText(parashaName, dateISO, assignObj){
  const lines = [`פרשת ${parashaName} | שבת ${formatDate(dateISO)}`];
  for(let i=1;i<=7;i++){
    const id = assignObj[i] || assignObj[String(i)];
    const person = id ? resolvePerson(id) : null;
    const name = person ? person.name : '—';
    lines.push(`${ALIYAH_NAMES[i-1]} - ${name}`);
  }
  return lines.join('\n');
}
function printWeek(parashaName, dateISO, assignObj){
  const rows = [];
  for(let i=1;i<=7;i++){
    const id = assignObj[i] || assignObj[String(i)];
    const person = id ? resolvePerson(id) : null;
    rows.push(`<tr><td style="padding:8px 10px;border-bottom:1px solid #ccc;font-weight:700;">${ALIYAH_NAMES[i-1]}</td><td style="padding:8px 10px;border-bottom:1px solid #ccc;">${person ? person.name : '—'}</td></tr>`);
  }
  STATE.printModal = `
    <div style="text-align:center;margin-bottom:18px;">
      <div style="font-size:13px;font-weight:800;letter-spacing:1px;">בית כנסת נצח בנים</div>

    </div>
    <table style="width:100%;border-collapse:collapse;font-size:16px;">${rows.join('')}</table>
  `;
  render();
}

function buildWeekPanels(parashaName, assignObj, reasons){
  reasons = reasons || {};
  const split = getSplit(parashaName);
  // which aliyah number(s) each (non-guest) person currently holds this week -
  // used to fully block picking them anywhere else, not just warn about it
  const assignedAliyahOf = {};
  for(let k=1;k<=7;k++){
    const v = assignObj[k] || assignObj[String(k)];
    if(v && !v.startsWith('guest:')) (assignedAliyahOf[v] = assignedAliyahOf[v]||[]).push(k);
  }
  let html = '';
  for(let i=1;i<=7;i++){
    const pesukim = split[i-1];
    const assignedId = assignObj[i] || assignObj[String(i)] || '';
    const isGuest = assignedId.startsWith && assignedId.startsWith('guest:');
    const guestName = isGuest ? assignedId.slice(6) : '';
    const person = isGuest ? null : resolvePerson(assignedId);
    let mismatch = '';
    if(person && !fits(person, pesukim)){
      const lowerPct = (STATE.matchSettings && STATE.matchSettings.lower) || 80;
      const upperPct = (STATE.matchSettings && STATE.matchSettings.upper) || 110;
      const min = Math.round(person.level*(lowerPct/100)), max = Math.round(person.level*(upperPct/100));
      mismatch = pesukim > max
        ? `⚠ מעל היכולת (טווח מומלץ: ${min}–${max})`
        : `⚠ עלייה קלה מדי עבורו - "מבזבז" יכולת (טווח מומלץ: ${min}–${max})`;
    }
    html += `
      <div class="panel">
        <div class="seal"><div class="heb-letter">${HEB_LETTERS[i-1]}</div></div>
        <div class="aliyah-name">עולה ${ALIYAH_NAMES[i-1]}</div>
        <div class="pesukim">${pesukim} פסוקים</div>
        <select data-aliyah="${i}">
          <option value="">— לא שובץ —</option>
          ${STATE.congregants.map(c=>{
            const heldElsewhere = assignedAliyahOf[c.id] && assignedAliyahOf[c.id].some(k=>k!==i);
            return `<option value="${c.id}" ${assignedId===c.id?'selected':''} ${heldElsewhere?'disabled':''}>${c.name} ${c.unrestricted?'(מתפלל חזק)':`(עד ${c.level})`}${c.paused?' - מושהה':''}${heldElsewhere?' - משובץ לעלייה אחרת':''}</option>`;
          }).join('')}
          <option value="guest" ${isGuest?'selected':''}>👤 אורח (שם מותאם)</option>
        </select>
        ${isGuest ? `<input type="text" data-guestname="${i}" placeholder="שם האורח" value="${guestName}" style="margin-top:6px;font-size:13px;padding:6px 8px;">` : ''}
        ${(person && !isGuest) ? (()=>{
          const link = whatsappLinkForPerson(person, parashaName, ALIYAH_NAMES[i-1]);
          return link
            ? `<a class="btn btn-outline btn-sm" href="${link}" target="_blank" style="margin-top:8px;display:inline-block;">📱 שלח לו</a>`
            : `<div class="mini" style="margin-top:8px;">אין טלפון שמור</div>`;
        })() : ''}
        ${mismatch ? `<div class="mismatch">${mismatch}</div>`:''}
        ${(assignedId && !isGuest && assignedAliyahOf[assignedId] && assignedAliyahOf[assignedId].length>1) ? `<div class="mismatch">⚠ מתפלל זה מופיע ביותר מעלייה אחת בנתונים - כדאי לתקן</div>`:''}
        ${(!assignedId && reasons[i]) ? `<div class="mismatch">ℹ ${reasons[i]}</div>`:''}
      </div>`;
  }
  return html;
}

    const daysSince = Math.floor((new Date() - new Date(lastConfirmedDate)) / (1000*60*60*24));
    if(daysSince > 8){
      const reminder = el(`<div class="card" style="border-color:var(--warn);"></div>`);
      reminder.innerHTML = `<div class="note" style="color:var(--warn);font-weight:700;">⏰ עברו ${daysSince} ימים מאז השיבוץ האחרון שאושר (${formatDate(lastConfirmedDate)}) — כדאי לבצע שיבוץ לשבת הקרובה.</div>`;
      wrap.appendChild(reminder);
    }

    const reminder = el(`<div class="card" style="border-color:var(--warn);"></div>`);
    reminder.innerHTML = `<div class="note" style="color:var(--warn);font-weight:700;">⏰ עדיין לא בוצע שום שיבוץ מאושר. כדאי לבצע שיבוץ לשבת הקרובה.</div>`;

  const fallbackName = suggestionValid ? STATE.suggestedParasha.name : PARASHOT_DEFAULT_TOTALS[0][0];

      </div>
    </div>

      <div class="note">אם כבר ידוע מראש שמישהו חייב לקבל עלייה מסוימת (למשל בר מצווה) — בחר אותו כאן לפני "בצע שיבוץ". שאר העליות ישובצו הוגן כרגיל סביב הבחירה הזו.</div>

      lockCard.querySelectorAll('select[data-aliyah]').forEach(sel=>{
        sel.onchange = ()=>{
          const num = sel.dataset.aliyah;
          const val = sel.value;
          if(val==='guest') STATE.pendingLocks[num] = 'guest:';
          else if(val) STATE.pendingLocks[num] = val;
          else delete STATE.pendingLocks[num];
          render();
        };

        inp.onchange = ()=>{
          STATE.pendingLocks[inp.dataset.guestname] = 'guest:' + inp.value.trim();
          render();

    },0);

        <button class="btn btn-outline" id="resetAssignBtn">איפוס עליות</button>
      </div>
    `;
    wrap.appendChild(c2);

    setTimeout(()=>{
      c2.querySelectorAll('select[data-aliyah]').forEach(sel=>{
        sel.onchange = ()=>{
          const num = sel.dataset.aliyah;
          const val = sel.value;
          if(val==='guest') STATE.current.assign[num] = 'guest:';
          else if(val) STATE.current.assign[num] = val;
          else delete STATE.current.assign[num];
          saveCurrent();
          render();
        };
      });
      c2.querySelectorAll('input[data-guestname]').forEach(inp=>{
        inp.onchange = ()=>{
          const num = inp.dataset.guestname;
          STATE.current.assign[num] = 'guest:' + inp.value.trim();
          saveCurrent();
          render();
        };
      });
      c2.querySelector('#confirmBtn').onclick = confirmAssignment;
      c2.querySelector('#copyTextBtn').onclick = ()=> copyWeekText(STATE.current.parasha, STATE.current.date, STATE.current.assign);
      c2.querySelector('#printBtn').onclick = ()=> printWeek(STATE.current.parasha, STATE.current.date, STATE.current.assign);
      c2.querySelector('#resetAssignBtn').onclick = ()=>{
        STATE.current.assign = {};
        STATE.current.deferred = [];
        STATE.current.unfilledReasons = {};
        saveCurrent();
        render();
      };
    },0);
  }

  setTimeout(()=>{
    document.getElementById('parashaSelect').onchange = (e)=>{
      if(STATE.current){
        // a draft for the old parasha exists - selecting a different one means starting over
        STATE.current = null;
        saveCurrent();
      }
      STATE.pendingParasha = e.target.value;
      STATE.pendingLocks = {};
      render();
    };
    const dateInput = document.getElementById('dateInput');
    if(dateInput) dateInput.onchange = (e)=>{ STATE.pendingDate = e.target.value; };
    document.getElementById('startBtn').onclick = ()=>{

      runAssignment(name, date, STATE.pendingLocks);
      STATE.pendingLocks = {};
      render();
    };
  },0);

  return wrap;
}

      <div style="display:flex;gap:6px;flex:0 0 auto;">
        <button class="btn btn-sm ${STATE.peopleSortMode==='name'?'btn-ink':'btn-outline'}" id="sortByName" type="button">א-ב</button>
        <button class="btn btn-sm ${STATE.peopleSortMode==='stale'?'btn-ink':'btn-outline'}" id="sortByStale" type="button">הכי מזמן שלא קרא</button>
      </div>
    </div>
    <div class="note">תגית "⚠ מעל/מתחת לממוצע" מופיעה כשמתפלל רגיל קורא הרבה יותר/פחות מהממוצע — לרוב סימן שרק הוא (או כמעט רק הוא) מתאים לאורך עלייה נפוץ מסוים. אם זה קורה הרבה, כדאי לשקול להרחיב מעט את טווח האחוזים בטאב "פרשות ועליות".</div>
    ${rowsWithStats.length===0 ? `<div class="empty-state"><div class="big">אין עדיין מתפללים</div>הוסף מתפלל כדי להתחיל</div>` : `
    <table style="margin-top:10px;">
      <tr><th>שם</th><th>טווח פסוקים מקסימלי</th><th>סה"כ עליות</th><th>עלייה אחרונה</th><th></th></tr>
      ${rowsWithStats.map(({c, stats})=>{
        const last = stats.lastEntry;
        let lastCell;
        if(last){
          lastCell = `<b>${last.date ? formatDate(last.date) : 'תאריך לא ידוע'}</b> · ${last.parasha}, עולה ${ALIYAH_NAMES[last.aliyah-1]}`;
        } else if(c.baseTotal>0){
          lastCell = 'תאריך מדויק לא תועד';
        } else {
          lastCell = 'טרם עלה';
        }
        let imbalanceFlag = '';
        if(!c.unrestricted && avgNormal>0 && normalTotals.length>3){
          if(stats.total >= avgNormal*1.8) imbalanceFlag = ` <span class="pill pill-warn" title="משמעותית מעל הממוצע (${avgNormal.toFixed(1)})">⚠ מעל הממוצע</span>`;
          else if(stats.total <= avgNormal*0.4 && stats.total < avgNormal-3) imbalanceFlag = ` <span class="pill pill-warn" title="משמעותית מתחת לממוצע (${avgNormal.toFixed(1)})">⚠ מתחת לממוצע</span>`;
        }
        return `
        <tr style="${c.paused?'opacity:0.55;':''}">
          <td class="name-cell">${c.name}${c.paused?` <span class="pill pill-warn">מושהה</span>`:''}</td>
          <td>${c.unrestricted ? `<span class="pill pill-good">מתפלל חזק</span>` : `<span class="pill pill-gold">עד ${c.level}</span>`}</td>
          <td><span class="pill pill-muted">${stats.total}</span>${imbalanceFlag}</td>
          <td class="mini">${lastCell}</td>
          <td class="actions-cell">
            <button class="btn btn-outline btn-sm" data-history="${c.id}">היסטוריה</button>
            <button class="btn btn-outline btn-sm" data-pause="${c.id}">${c.paused?'הפעל מחדש':'השהה'}</button>
            <button class="btn btn-outline btn-sm" data-edit="${c.id}">עריכה</button>
            <button class="btn btn-danger btn-sm" data-del="${c.id}">מחיקה</button>
          </td>
        </tr>
      `}).join('')}
    </table>`}
  `;
  wrap.appendChild(card);
  setTimeout(()=>{
    document.getElementById('addPersonBtn').onclick = ()=>{ STATE.editingCongregant='new'; render(); };
    document.getElementById('exportBackupBtn').onclick = exportBackup;
    document.getElementById('exportCsvBtn').onclick = exportHistoryCsv;
    document.getElementById('importBackupBtn').onclick = ()=>{ document.getElementById('importFileInput').click(); };
    document.getElementById('importFileInput').onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          importBackup(JSON.parse(reader.result));
          notice('הגיבוי יובא בהצלחה.');
        }catch(err){
          notice('קובץ הגיבוי לא תקין - הייבוא נכשל.');
        }
      };
      reader.readAsText(file);
    };
    document.getElementById('sortByName').onclick = ()=>{ STATE.peopleSortMode='name'; render(); };
    document.getElementById('sortByStale').onclick = ()=>{ STATE.peopleSortMode='stale'; render(); };
    wrap.querySelectorAll('[data-history]').forEach(b=> b.onclick = ()=>{ STATE.viewingHistory = b.dataset.history; render(); });
    wrap.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=>{ STATE.editingCongregant = b.dataset.edit; render(); });
    wrap.querySelectorAll('[data-pause]').forEach(b=> b.onclick = ()=>{
      const p = STATE.congregants.find(c=>c.id===b.dataset.pause);
      if(p){ p.paused = !p.paused; saveCongregants(); render(); }
    });
    wrap.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=>{
      askConfirm('למחוק את המתפלל? הפעולה אינה הפיכה.', ()=>{
        STATE.congregants = STATE.congregants.filter(c=>c.id!==b.dataset.del);
        saveCongregants(); render();
      });
    });
  },0);
  return wrap;
}

function renderCongregantModal(){
  const isNew = STATE.editingCongregant==='new';
  const person = isNew ? {name:'',level:20,baseTotal:0,unrestricted:false,phone:''} : STATE.congregants.find(c=>c.id===STATE.editingCongregant);
  const backdrop = el(`<div class="modal-backdrop"></div>`);
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${isNew?'הוספת מתפלל':'עריכת מתפלל'}</h3>
      <div class="field"><label>שם מלא</label><input type="text" id="f-name" value="${person.name}"></div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;font-weight:700;">
          <input type="checkbox" id="f-unrestricted" style="width:auto;" ${person.unrestricted?'checked':''}>
          מתפלל חזק (ללא הגבלת טווח — תמיד יקבל את העלייה הארוכה ביותר שנותרה)
        </label>
      </div>
      <div class="field" id="levelField" style="${person.unrestricted?'display:none;':''}">
        <label>טווח פסוקים מקסימלי (יכולת)</label>
        <input type="number" id="f-level" value="${person.level}" min="3">
        <div class="note">המתפלל יקבל רק עליות בטווח ${STATE.matchSettings.lower}%–${STATE.matchSettings.upper}% מהמספר הזה.</div>
      </div>
      <div class="field">
        <label>מספר טלפון (רשות - לשליחת וואטסאפ)</label>
        <div class="row-flex" style="gap:8px;align-items:center;">
          <div style="flex:1;"><input type="text" id="f-phone" value="${person.phone||''}" placeholder="050-1234567" dir="ltr" style="text-align:left;"></div>
          <button type="button" class="btn btn-outline btn-sm" id="pickContactBtn" style="flex:0 0 auto;">📇 בחר מאנשי קשר</button>
        </div>
      </div>
      ${isNew ? `
      <div class="note">אופציונלי: אם ידוע לך על עלייה אחרונה ספציפית (כולל תאריך), אפשר לתעד אותה כאן — היא תופיע בהיסטוריה שלו.</div>
      <div class="row-flex">
        <div class="field"><label>תאריך</label><input type="date" id="f-lastDate"></div>
        <div class="field"><label>פרשה</label>
          <select id="f-lastParasha">
            <option value="">— אין —</option>
            ${PARASHOT_DEFAULT_TOTALS.map(p=>`<option value="${p[0]}">${p[0]}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>עלייה</label>
          <select id="f-lastAliyah">
            <option value="">—</option>
            ${ALIYAH_NAMES.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('')}
          </select>
        </div>
      </div>` : ''}
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelModal">ביטול</button>
        <button class="btn btn-gold" id="saveModal">שמירה</button>
      </div>
    </div>
  `;
  setTimeout(()=>{
    backdrop.querySelector('#f-unrestricted').onchange = (e)=>{
      backdrop.querySelector('#levelField').style.display = e.target.checked ? 'none' : '';
    };
    backdrop.querySelector('#pickContactBtn').onclick = async ()=>{
      if(!('contacts' in navigator && 'ContactsManager' in window)){
        notice('בחירה מאנשי קשר לא נתמכת בדפדפן/במכשיר הזה (עובד בעיקר בכרום באנדרואיד) - אפשר להזין את המספר ידנית בשדה.');
        return;
      }
      try{
        const contacts = await navigator.contacts.select(['name','tel'], {multiple:false});
        if(contacts && contacts.length){
          const c = contacts[0];
          if(c.tel && c.tel.length) document.getElementById('f-phone').value = c.tel[0];
          const nameField = document.getElementById('f-name');
          if(c.name && c.name.length && !nameField.value.trim()) nameField.value = c.name[0];
        }
      }catch(e){
        // user cancelled the picker - nothing to do
      }
    };
    backdrop.querySelector('#cancelModal').onclick = ()=>{ STATE.editingCongregant=null; render(); };
    backdrop.querySelector('#saveModal').onclick = ()=>{
      const name = document.getElementById('f-name').value.trim();
      const unrestricted = document.getElementById('f-unrestricted').checked;
      const level = unrestricted ? 100 : (parseInt(document.getElementById('f-level').value)||20);
      const phone = document.getElementById('f-phone').value.trim();
      if(!name){ notice('יש להזין שם'); return; }
      if(isNew){
        const newId = 'c'+Math.random().toString(36).slice(2,9);
        STATE.congregants.push({ id:newId, name, level, baseTotal:0, unrestricted, phone });
        const lastParasha = document.getElementById('f-lastParasha').value;
        const lastAliyah = document.getElementById('f-lastAliyah').value;
        const lastDate = document.getElementById('f-lastDate').value;
        if(lastParasha && lastAliyah){
          STATE.weeklyLog.push({
            id: genId(),
            date: lastDate || '',
            parasha: lastParasha,
            assign: { [lastAliyah]: newId },
            deferred: []
          });
          saveWeeklyLog();
        }
      }else{
        const p = STATE.congregants.find(c=>c.id===STATE.editingCongregant);
        p.name=name; p.level=level; p.unrestricted=unrestricted; p.phone=phone;
        // baseTotal is intentionally left untouched here - total reads come only from
        // actual weeklyLog entries (past-week backfill or ongoing confirmed assignments)
      }
      saveCongregants();
      STATE.editingCongregant=null;
      render();
    };
  },0);
  return backdrop;
}

function renderManualWeekModal(){
  const draft = STATE.manualWeekDraft;
  const backdrop = el(`<div class="modal-backdrop"></div>`);
  const panels = buildWeekPanels(draft.parasha, draft.assign);
  backdrop.innerHTML = `
    <div class="modal" style="max-width:640px;">
      <h3>הוספת שבת עבר</h3>
      <div class="note">למילוי שבת שכבר התקיימה לפני תחילת השימוש באתר — כדי שהסבב ההוגן ייקח אותה בחשבון.</div>
      <div class="row-flex" style="margin-top:10px;">
        <div class="field">
          <label>פרשה</label>
          <select id="mw-parasha">
            ${PARASHOT_DEFAULT_TOTALS.map(p=>`<option value="${p[0]}" ${draft.parasha===p[0]?'selected':''}>${p[0]}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>תאריך</label>
          <input type="date" id="mw-date" value="${draft.date}">
        </div>
      </div>
      <div class="week-strip">${panels}</div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="mw-cancel">ביטול</button>
        <button class="btn btn-gold" id="mw-save">שמירה</button>
      </div>
    </div>
  `;
  setTimeout(()=>{
    backdrop.querySelector('#mw-parasha').onchange = (e)=>{
      draft.parasha = e.target.value;
      render();
    };
    backdrop.querySelector('#mw-date').onchange = (e)=>{ draft.date = e.target.value; };
    backdrop.querySelectorAll('select[data-aliyah]').forEach(sel=>{
      sel.onchange = ()=>{
        const num = sel.dataset.aliyah;
        const val = sel.value;
        if(val==='guest') draft.assign[num] = 'guest:';
        else if(val) draft.assign[num] = val;
        else delete draft.assign[num];
        render();
      };
    });
    backdrop.querySelectorAll('input[data-guestname]').forEach(inp=>{
      inp.onchange = ()=>{
        draft.assign[inp.dataset.guestname] = 'guest:' + inp.value.trim();
        render();
      };
    });
    backdrop.querySelector('#mw-cancel').onclick = ()=>{ STATE.manualWeekDraft=null; render(); };
    backdrop.querySelector('#mw-save').onclick = ()=>{
      const dateVal = backdrop.querySelector('#mw-date').value;
      if(!dateVal){ notice('יש להזין תאריך'); return; }
      STATE.weeklyLog.push({
        id: genId(),
        date: dateVal,
        parasha: draft.parasha,
        assign: {...draft.assign},
        deferred: []
      });
      saveWeeklyLog();
      STATE.manualWeekDraft = null;
      render();
    };
  },0);
  return backdrop;
}

function renderHistoryModal(){
  const person = STATE.congregants.find(c=>c.id===STATE.viewingHistory);
  const backdrop = el(`<div class="modal-backdrop"></div>`);
  if(!person){
    STATE.viewingHistory = null;
    return el(`<div></div>`);
  }
  const stats = getCongStats(person.id);
  const hist = stats.history; // newest first already
  backdrop.innerHTML = `
    <div class="modal">
      <h3>היסטוריית עליות — ${person.name}</h3>
      <div class="note">סה"כ ${stats.total} עליות${person.baseTotal ? ` (כולל ${person.baseTotal} עליות קודמות שתועדו ידנית ללא פירוט תאריך)`:''}. הרשימה למטה מוצגת מהחדשה לישנה.</div>
      ${hist.length===0 ? `<div class="empty-state" style="padding:18px 0;">אין עדיין היסטוריה מפורטת עבור מתפלל זה.</div>` : `
      <table style="margin-top:12px;">
        <tr><th>תאריך</th><th>פרשה</th><th>עלייה</th></tr>
        ${hist.map(h=>`
          <tr>
            <td class="mini">${h.date ? formatDate(h.date) : '—'}</td>
            <td class="name-cell">${h.parasha}</td>
            <td class="mini">${ALIYAH_NAMES[h.aliyah-1]}</td>
          </tr>
        `).join('')}
      </table>`}
      <div class="modal-actions">
        <button class="btn btn-gold" id="closeHistory" style="flex:1;">סגירה</button>
      </div>
    </div>
  `;
  setTimeout(()=>{
    backdrop.querySelector('#closeHistory').onclick = ()=>{ STATE.viewingHistory=null; render(); };
  },0);
  return backdrop;
}

function renderParashotTab(){
  const wrap = el(`<div></div>`);

  const settingsCard = el(`<div class="card"></div>`);
  settingsCard.innerHTML = `
    <h2>הגדרות התאמה</h2>
    <div class="note">הטווח שקובע איזו עלייה "מתאימה" למתפלל רגיל, ביחס ליכולת המקסימלית שהוגדרה לו. ברירת המחדל: 80%–110%.</div>
    <div class="row-flex" style="margin-top:8px;max-width:360px;">
      <div class="field"><label>אחוז תחתון</label><input type="number" id="ms-lower" value="${STATE.matchSettings.lower}" min="10" max="100"></div>
      <div class="field"><label>אחוז עליון</label><input type="number" id="ms-upper" value="${STATE.matchSettings.upper}" min="100" max="300"></div>
      <div style="flex:0 0 auto;"><button class="btn btn-gold btn-sm" id="saveMatchSettings">שמירה</button></div>
    </div>
  `;
  wrap.appendChild(settingsCard);

  const waCard = el(`<div class="card"></div>`);
  waCard.innerHTML = `
    <h2>תבנית הודעת וואטסאפ</h2>
    <div class="note">הטקסט שנשלח כשלוחצים על "📱 שלח לו". אפשר להשתמש בשלוש התוויות האלה, והן יוחלפו אוטומטית: <b>{שם}</b>, <b>{עלייה}</b>, <b>{פרשה}</b>.</div>
    <textarea id="wa-template" rows="3" style="width:100%;margin-top:8px;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);font-family:'Assistant',sans-serif;font-size:14px;">${STATE.whatsappTemplate || DEFAULT_WHATSAPP_TEMPLATE}</textarea>
    <div style="margin-top:10px;display:flex;gap:8px;">
      <button class="btn btn-gold btn-sm" id="saveWaTemplate">שמירה</button>
      <button class="btn btn-outline btn-sm" id="resetWaTemplate">איפוס לברירת המחדל</button>
    </div>
  `;
  wrap.appendChild(waCard);

  const card = el(`<div class="card"></div>`);
  card.innerHTML = `
    <h2>פרשות ועליות</h2>
    <div class="note">
      <b>עדכון:</b> כל 54 הפרשות אומתו בפועל מול Sefaria / Hebcal / Artscroll (מסומנות "מאומת ✓"). חשוב לדעת: גם במקורות המאומתים יש לפעמים יותר ממסורת אחת לגבי המיקום המדויק של חלוקת עלייה (למשל בין חומשים שונים) — כך שבכל מקרה כדאי לוודא מול החומש הנהוג בבית הכנסת שלכם, במיוחד לפני שבת קרובה. לחיצה על "עריכה" מאפשרת לשנות את המספרים אם צריך.
    </div>
    <table style="margin-top:14px;">
      <tr><th>פרשה</th><th>סה"כ פסוקים</th><th>חלוקה לעליות (א-ז)</th><th>סטטוס</th><th>הערות</th><th></th></tr>
      ${PARASHOT_DEFAULT_TOTALS.map(p=>{
        const split = getSplit(p[0]);
        const status = getStatus(p[0]);
        const diff = getOverrideDiff(p[0]);
        return `<tr>
          <td class="name-cell">${p[0]}</td>
          <td class="mini">${p[1]}</td>
          <td class="mini">${split.join(' · ')}</td>
          <td><span class="pill ${status.cls}">${status.label}</span></td>
          <td class="mini">${diff}</td>
          <td><button class="btn btn-outline btn-sm" data-editp="${p[0]}">עריכה</button></td>
        </tr>`;
      }).join('')}
    </table>
  `;
  wrap.appendChild(card);
  setTimeout(()=>{
    wrap.querySelectorAll('[data-editp]').forEach(b=> b.onclick=()=>{ STATE.editingParasha=b.dataset.editp; render(); });
    document.getElementById('saveMatchSettings').onclick = ()=>{
      const lower = parseInt(document.getElementById('ms-lower').value)||80;
      const upper = parseInt(document.getElementById('ms-upper').value)||110;
      STATE.matchSettings = {lower, upper};
      saveMatchSettings();
      render();
    };
    document.getElementById('saveWaTemplate').onclick = ()=>{
      const val = document.getElementById('wa-template').value.trim();
      STATE.whatsappTemplate = val || DEFAULT_WHATSAPP_TEMPLATE;
      saveWhatsappTemplate();
      notice('התבנית נשמרה.');
    };
    document.getElementById('resetWaTemplate').onclick = ()=>{
      STATE.whatsappTemplate = null;
      saveWhatsappTemplate();
      render();
    };
  },0);
  return wrap;
}

function renderParashaModal(){
  const name = STATE.editingParasha;
  const split = getSplit(name);
  const backdrop = el(`<div class="modal-backdrop"></div>`);
  backdrop.innerHTML = `
    <div class="modal">
      <h3>עריכת חלוקת פסוקים — ${name}</h3>
      <div class="note">הזן/י את מספר הפסוקים בכל עלייה לפי החומש הנהוג בבית הכנסת.</div>
      <div class="parasha-edit-grid">
        ${split.map((n,i)=>`<div><label>${HEB_LETTERS[i]}</label><input type="number" min="3" data-idx="${i}" value="${n}"></div>`).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelP">ביטול</button>
        <button class="btn btn-gold" id="saveP">שמירה</button>
      </div>
    </div>
  `;
  setTimeout(()=>{
    backdrop.querySelector('#cancelP').onclick = ()=>{ STATE.editingParasha=null; render(); };
    backdrop.querySelector('#saveP').onclick = ()=>{
      const inputs = backdrop.querySelectorAll('input[data-idx]');
      const arr = new Array(7).fill(3);
      inputs.forEach(inp=>{ arr[parseInt(inp.dataset.idx)] = parseInt(inp.value)||3; });
      const baseline = getBaselineSplit(name);
      if(arraysEqual(arr, baseline)){
        // matches the verified/estimated baseline again - drop the override entirely
        delete STATE.parashot[name];
      } else {
        STATE.parashot[name] = arr;
      }
      saveParashot();
      STATE.editingParasha=null;
      render();
    };
  },0);
  return backdrop;
}

loadAll();
</script>
</body>
</html>
