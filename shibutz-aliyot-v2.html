<style>
@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#F5EEDC;
  --card:#FFFCF6;
  --ink:#202A44;
  --ink-soft:#5B6178;
  --gold:#B8924F;
  --gold-deep:#8F6B2E;
  --claret:#7C3F34;
  --claret-deep:#5E2E26;
  --line:#E3D5AE;
  --warn:#9B4A3D;
  --warn-bg:#F7E4DD;
  --good:#4B6B3E;
  --good-bg:#E8EEDC;
  --radius:16px;
}
*{box-sizing:border-box;}
html, body{ overflow-x:hidden; max-width:100vw; }
body::before{
  content:'';
  position:fixed; top:0; left:0; right:0; height:5px; z-index:100;
  background:repeating-linear-gradient(90deg, var(--gold) 0 24px, var(--claret) 24px 48px);
}
body{
  margin:0;
  background:var(--bg);
  background-image:
    radial-gradient(circle at 12% 0%, rgba(184,146,79,0.10), transparent 42%),
    radial-gradient(circle at 92% 100%, rgba(124,63,52,0.07), transparent 42%);
  color:var(--ink);
  font-family:'Assistant', sans-serif;
  direction:rtl;
  min-height:100vh;
  padding:32px 16px 64px;
}
.wrap{max-width:940px;margin:0 auto;}

header.top{
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; margin-bottom:14px; flex-wrap:wrap;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:14px;}
.brand-mark{flex-shrink:0; filter:drop-shadow(0 3px 6px rgba(143,107,46,0.35));}
.eyebrow{
  font-size:11.5px; font-weight:800; letter-spacing:1.2px; color:var(--gold-deep);
  text-transform:uppercase; margin-bottom:2px;
}
h1{
  font-family:'Frank Ruhl Libre', serif;
  font-weight:900;
  font-size:27px;
  margin:0;
  letter-spacing:0.2px;
  color:var(--ink);
}
.subtitle{font-size:13px;color:var(--ink-soft);margin-top:3px;letter-spacing:0.2px;}

nav.tabs{
  display:flex; gap:4px; background:var(--card); flex-wrap:wrap;
  border:1px solid var(--line); border-radius:12px; padding:5px;
  box-shadow:0 2px 8px rgba(32,42,68,0.06);
}
nav.tabs button{
  border:none;background:transparent;padding:9px 15px;border-radius:8px;
  font-family:'Assistant',sans-serif;font-weight:700;font-size:13.5px;
  color:var(--ink-soft); cursor:pointer; transition:all .15s; white-space:nowrap;
}
nav.tabs button.active{background:var(--ink);color:#FBF6E9;}
nav.tabs button:hover:not(.active){background:rgba(32,42,68,0.06); color:var(--ink);}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:24px; margin-bottom:20px; overflow-x:auto;
  box-shadow:0 1px 2px rgba(32,42,68,0.04), 0 8px 20px -6px rgba(32,42,68,0.08);
}
.card h2{
  font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:19.5px; margin:0 0 14px;
  display:flex;align-items:center;gap:8px;justify-content:space-between;
  color:var(--ink);
}
label{font-size:13px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px;letter-spacing:0.1px;}
select, input[type=text], input[type=number], input[type=date]{
  width:100%; padding:10px 12px; border-radius:9px; border:1.5px solid var(--line);
  font-family:'Assistant',sans-serif; font-size:15px; background:#fff; color:var(--ink);
  transition:border-color .15s;
}
select:focus, input:focus{outline:none;border-color:var(--gold);}

.date-pill{
  padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);
  background:linear-gradient(180deg,#F1E7CC,#E9DBB6);
  font-weight:800; color:var(--gold-deep); text-align:center; letter-spacing:0.2px;
}

.row-flex{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;}
.row-flex > div{flex:1; min-width:160px;}

.btn{
  border:none; border-radius:10px; padding:11px 22px; font-weight:800; font-size:15px;
  cursor:pointer; font-family:'Assistant',sans-serif; transition:transform .1s, box-shadow .15s, background .15s;
}
.btn:active{transform:scale(0.97);}
.btn-gold{background:linear-gradient(160deg,var(--gold),var(--gold-deep));color:#fff;
  box-shadow:0 3px 10px rgba(143,107,46,0.35);}
.btn-gold:hover{box-shadow:0 6px 16px rgba(143,107,46,0.45); transform:translateY(-1px);}
.btn-start{font-size:18px;padding:15px 42px;letter-spacing:1.5px;}
.btn-ink{background:var(--ink);color:#FBF6E9;}
.btn-ink:hover{background:#2A3555;}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--gold); color:var(--gold-deep);}
.btn-danger{background:transparent;color:var(--warn);border:1.5px solid var(--warn-bg);}
.btn-danger:hover{background:var(--warn-bg);}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:7px;}

.center{text-align:center;}

.week-strip{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
  gap:12px; margin:18px 0;
}
.panel{
  background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:16px 12px 14px; text-align:center; position:relative;
  transition:box-shadow .15s;
}
.panel:hover{box-shadow:0 4px 14px rgba(32,42,68,0.08);}
.panel .seal{
  width:40px; height:40px; margin:0 auto 8px; border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #9A5142, var(--claret) 55%, var(--claret-deep) 100%);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 6px rgba(94,46,38,0.4), inset 0 1px 1px rgba(255,255,255,0.25);
}
.panel .heb-letter{
  font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:19px; color:#F9E9C9;
}
.panel .aliyah-name{font-size:12.5px; color:var(--ink-soft); margin-top:2px; font-weight:700;}
.panel .pesukim{font-size:11.5px;color:var(--gold-deep); margin-top:4px; font-weight:700;}
.panel select{margin-top:10px; font-size:14px; padding:9px 8px; white-space:normal;}
.panel input[type=text]{font-size:13px;}
.panel .mismatch{
  font-size:11px;color:var(--warn); margin-top:6px; font-weight:700; line-height:1.4;
}

.confirmed-box{
  background:var(--good-bg); border:1px solid #C9D9BB; border-radius:10px;
  padding:12px 14px; margin-top:14px; font-size:13.5px; color:var(--good); font-weight:700;
}

table{width:100%; border-collapse:collapse; font-size:14px;}
th{
  text-align:right; font-size:11.5px; color:var(--ink-soft); font-weight:800;
  padding:9px 8px; border-bottom:2px solid var(--line); letter-spacing:0.2px;
}
td{padding:11px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:rgba(184,146,79,0.05);}
.pill{
  display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700;
}
.pill-gold{background:#F1E4C9;color:var(--gold-deep);}
.pill-muted{background:#EFEAE0;color:var(--ink-soft);}
.pill-good{background:var(--good-bg);color:var(--good);}
.pill-warn{background:var(--warn-bg);color:var(--warn);}
.name-cell{font-weight:700;}
.mini{font-size:12px;color:var(--ink-soft);}
.actions-cell{white-space:nowrap;}

.empty-state{
  text-align:center; padding:40px 20px; color:var(--ink-soft);
}
.empty-state .big{font-family:'Frank Ruhl Libre',serif; font-size:20px; color:var(--ink); margin-bottom:6px;}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(32,42,68,0.5); backdrop-filter:blur(2px); display:flex;
  align-items:center; justify-content:center; z-index:50; padding:20px;
}
.modal{
  background:var(--card); border-radius:18px; padding:26px; max-width:440px; width:100%;
  box-shadow:0 24px 60px rgba(0,0,0,0.3); max-height:88vh; overflow-y:auto; overflow-x:auto;
  border:1px solid var(--line);
}
.modal h3{font-family:'Frank Ruhl Libre',serif;margin:0 0 16px;font-size:20px;color:var(--ink);}
.field{margin-bottom:14px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions .btn{flex:1;}

.note{font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin-top:10px;}
.divider{height:1px;background:var(--line);margin:18px 0;}

.parasha-edit-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px;}
.parasha-edit-grid div label{font-size:11px;margin-bottom:4px;text-align:center;}
.parasha-edit-grid input{text-align:center;padding:8px 4px;}

.week-card-header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.week-card-header .wdate{font-size:12.5px;color:var(--ink-soft);font-weight:700;}

.archive-block{cursor:pointer; user-select:none; display:flex; align-items:center; justify-content:space-between; gap:10px;}
.archive-block:hover{opacity:0.85;}
.archive-chevron{transition:transform .2s; font-size:14px; color:var(--gold-deep); flex-shrink:0;}
.archive-chevron.open{transform:rotate(180deg);}
.archive-summary{font-size:12px;color:var(--ink-soft);margin-top:2px;}

/* per-aliyah panel state - a quick visual scan of the week without reading every card */
.panel[data-state="filled"]{border-color:#C9D9BB; box-shadow:inset 0 0 0 1px rgba(75,107,62,0.15);}
.panel[data-state="warning"]{border-color:#E7C9B9; box-shadow:inset 0 0 0 1px rgba(155,74,61,0.12);}
.panel[data-state="empty"]{border-style:dashed;}

.progress-bar{
  height:7px; border-radius:20px; background:var(--line); overflow:hidden; margin-top:8px;
}
.progress-bar .fill{
  height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-deep));
  border-radius:20px; transition:width .3s ease;
}
.progress-label{font-size:12px;color:var(--ink-soft);font-weight:700;margin-top:4px;}

.stat-pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.stat-tile{
  background:linear-gradient(180deg,#F8F2E0,#F1E7CC); border:1px solid var(--line); border-radius:10px;
  padding:8px 14px; font-size:12.5px; color:var(--gold-deep); font-weight:700; flex:1; min-width:180px;
}

/* ---------- fairness tab ---------- */
.fairness-hero{display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin-bottom:6px;}
.fairness-seal{
  width:92px; height:92px; border-radius:50%; flex-shrink:0;
  background:radial-gradient(circle at 32% 28%, #9A5142, var(--claret) 55%, var(--claret-deep) 100%);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  box-shadow:0 3px 10px rgba(94,46,38,0.4), inset 0 1px 1px rgba(255,255,255,0.25);
}
.fairness-seal .fs-num{font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:34px; color:#F9E9C9; line-height:1;}
.fairness-seal .fs-label{font-size:9.5px; color:#F1D9A8; font-weight:700; margin-top:2px;}
.fairness-status{font-size:14.5px; font-weight:700;}
.fairness-status.status-good{color:var(--good);}
.fairness-status.status-warn{color:var(--warn);}
.fairness-status-sub{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}

.rank-row{display:grid; grid-template-columns:140px 1fr 34px; align-items:center; gap:10px; padding:5px 0;}
.rank-name{font-size:12.5px; font-weight:700; color:var(--ink); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rank-track{position:relative; height:16px; background:#F1EADA; border-radius:6px; overflow:hidden;}
.rank-fill{position:absolute; top:0; bottom:0; right:0; border-radius:6px; background:linear-gradient(90deg,var(--gold),var(--gold-deep));}
.rank-fill.flag-high{background:linear-gradient(90deg,var(--warn),#B25F4E);}
.rank-fill.flag-low{background:linear-gradient(90deg,var(--ink-soft),var(--ink));}
.rank-value{font-size:12.5px; font-weight:800; color:var(--ink); text-align:left; direction:ltr;}
.rank-avg-col{position:relative;}
.rank-avg-line{position:absolute; top:0; bottom:0; width:0; border-right:1.5px dashed var(--claret); pointer-events:none;}

.sim-strip{
  margin-top:18px; padding-top:16px; border-top:1px solid var(--line);
  display:flex; gap:20px; flex-wrap:wrap; align-items:flex-end;
}
.sim-strip .sim-slide{flex:1; min-width:160px;}
.sim-strip label{display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
input[type=range]{width:100%; accent-color:var(--gold-deep); height:18px; cursor:pointer;}
.sim-readout{font-size:12.5px; color:var(--ink-soft); flex:0 0 auto;}
.sim-readout b{color:var(--ink); font-size:14px;}

/* ---------- fairness queue tab: one simple table, current draft only ---------- */
.queue-table-wrap{border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:0 1px 2px rgba(32,42,68,0.04);}
.queue-table{width:100%; border-collapse:collapse; font-size:13.5px; background:var(--card);}
.queue-table th{
  text-align:right; font-size:10.5px; color:var(--gold-deep); font-weight:800; letter-spacing:0.4px;
  text-transform:uppercase; padding:11px 16px; background:linear-gradient(180deg,#F3E9CC,#EDDFB8);
  border-bottom:1px solid var(--line);
}
.queue-table td{padding:12px 16px; border-bottom:1px solid var(--line); vertical-align:middle;}
.queue-table tr:last-child td{border-bottom:none;}
.queue-table tbody tr{transition:background .1s;}
.queue-table tbody tr:hover td{background:rgba(184,146,79,0.07);}
.queue-table tr.row-selected td{background:var(--good-bg);}
.queue-table tr.row-selected:hover td{background:var(--good-bg);}
.queue-table tr.row-skip td{background:#FBF3DD;}
.queue-table tr.row-skip:hover td{background:#FBF3DD;}

.queue-rank-badge{
  display:flex; align-items:center; justify-content:center; margin:0 auto;
  width:30px; height:30px; border-radius:50%;
  background:linear-gradient(160deg,#F1E4C9,#DDBF87); color:var(--gold-deep);
  font-weight:800; font-size:13px; box-shadow:inset 0 1px 1px rgba(255,255,255,0.6);
}
.row-selected .queue-rank-badge{background:linear-gradient(160deg,#C9D9BB,#8FAE7C); color:#fff;}

.queue-name-line{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
.queue-name-line b{font-size:14.5px; color:var(--ink);}
.queue-total-pill{font-size:10.5px; font-weight:700; color:var(--ink-soft); background:#EFEAE0; padding:2px 9px; border-radius:20px; white-space:nowrap;}

.queue-status-pill{display:inline-block; padding:3px 12px; border-radius:20px; font-size:12px; font-weight:800; white-space:nowrap;}
.queue-status-pill.good{background:var(--good-bg); color:var(--good);}
.queue-status-pill.pending{background:#F1E4C9; color:var(--gold-deep);}
.queue-status-pill.muted{background:#EFEAE0; color:var(--ink-soft);}
.queue-status-detail{font-size:11.5px; color:var(--ink-soft); margin-top:5px; line-height:1.55;}

/* relative-total mini bar under the name - visual density even before reading any number */
.queue-total-track{margin-top:6px; height:4px; border-radius:3px; background:#EFEAE0; overflow:hidden; max-width:180px;}
.queue-total-fill{height:100%; border-radius:3px; background:linear-gradient(90deg,var(--gold),var(--gold-deep));}
.row-selected .queue-total-fill{background:linear-gradient(90deg,#9DBE8A,var(--good));}

/* the table "comes alive": rows sweep in top-to-bottom in queue order (mirrors how the algorithm
   itself scans down the list), and a winner's rank badge gets one brief glow right after it
   lands. Both keyed off --i (row index) via animation-delay; both respect reduced-motion. */
@keyframes queueRowReveal{ from{opacity:0; transform:translateX(10px);} to{opacity:1; transform:translateX(0);} }
@keyframes queueWinnerGlow{
  0%{box-shadow:0 0 0 0 rgba(75,107,62,0.5);}
  70%{box-shadow:0 0 0 10px rgba(75,107,62,0);}
  100%{box-shadow:0 0 0 0 rgba(75,107,62,0);}
}
.queue-table tbody tr{animation:queueRowReveal .4s ease both; animation-delay:calc(var(--i,0) * 35ms);}
.row-selected .queue-rank-badge{animation:queueWinnerGlow 1.2s ease-out; animation-delay:calc(var(--i,0) * 35ms + .4s);}
@media (prefers-reduced-motion: reduce){
  .queue-table tbody tr, .row-selected .queue-rank-badge{animation:none;}
}

.person-card-list{display:none;}
.person-card{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:14px; margin-bottom:10px;
}
.person-card.paused{opacity:0.6;}
.person-card .pc-top{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.person-card .pc-name{font-weight:700; font-size:15px;}
.person-card .pc-stats{font-size:12.5px; color:var(--ink-soft); margin-top:6px;}
.person-card .pc-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
.person-card .pc-actions > div{flex:1; min-width:80px;}
.person-card .pc-actions .btn{width:100%;}

.print-only{ display:none; }
@media print{
  @page{ margin:1.2cm; }
  html, body{ padding:0 !important; margin:0 !important; height:auto !important; overflow:visible !important; }
  body > *:not(#printArea){ display:none !important; }
  body::before{ display:none !important; }
  #printArea{ display:block !important; padding:0 !important; margin:0 !important; }
}
@media (max-width:640px){
  .week-strip{grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));}
  .parasha-edit-grid{grid-template-columns:repeat(4,1fr);}
  .people-table-wrap{display:none;}
  .person-card-list{display:block;}
}

/* render() rebuilds .card/.modal from scratch every time, so a fresh node exists on every
   render - the animation replays automatically with no JS trigger needed. */
@keyframes fadeSlideIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
@keyframes modalPopIn{ from{opacity:0; transform:scale(0.96);} to{opacity:1; transform:scale(1);} }
/* only animated on an actual tab switch (see render()'s isTabSwitch) - .card itself isn't
   targeted, because render() also fires on every keystroke in a live-filter input, and
   replaying a fade on the whole tab body on every character would be distracting, not polish. */
#content.tab-enter{animation:fadeSlideIn .2s ease;}
.modal-backdrop{animation:fadeSlideIn .15s ease;}
.modal{animation:modalPopIn .18s ease;}
@media (prefers-reduced-motion: reduce){
  #content.tab-enter, .modal-backdrop, .modal{animation:none;}
}

<script>

const PARASHOT_DEFAULT_TOTALS = [
  ["בראשית",146],["נח",153],["לך לך",126],["וירא",147],["חיי שרה",105],["תולדות",106],

// ---------- parasha reading-cycle order (the real basis for "how long ago", see below) ----------
// The annual cycle has one fixed order. That order is a far more reliable "how long ago" signal
// than the date field: the date is typed by hand per week and can be wrong or reused (e.g. testing
// several parashot under the same date, or a gabbai fixing a typo later) without the parasha
// choice itself ever being wrong - so gap distance is computed from parasha position, and the
// calendar date is kept only as a secondary display hint, never as part of this calculation.
// Combined double portions (read only in non-leap years) are aliased to the first of their pair so
// they land at roughly the right cycle position instead of looking unrelated to their split-form
// neighbors.
const PARASHA_ORDER = PARASHOT_DEFAULT_TOTALS.map(p=>p[0]);
const PARASHA_CYCLE_LEN = 54; // the 54 regular (non-combined) parashot, in order, before it repeats
const PARASHA_COMBINED_ALIAS = {
  "ויקהל-פקודי":"ויקהל", "תזריע-מצורע":"תזריע", "אחרי מות-קדושים":"אחרי מות",
  "בהר-בחוקותי":"בהר", "מטות-מסעי":"מטות", "נצבים-וילך":"נצבים"
};
function parashaOrderIndex(name){
  const key = PARASHA_COMBINED_ALIAS[name] || name;
  const idx = PARASHA_ORDER.indexOf(key);
  return idx===-1 ? null : idx;
}
// Circular distance from an earlier parasha to a later one along the yearly cycle - 1 means "the
// parasha immediately before this one" (read it last week), large numbers mean a long time ago,
// including a full year back (which correctly comes out near PARASHA_CYCLE_LEN, not 0).
function parashaGap(fromName, toName){
  const a = parashaOrderIndex(fromName), b = parashaOrderIndex(toName);
  if(a===null || b===null) return Infinity; // unrecognized name - never block on unknown data
  let diff = (b - a + PARASHA_CYCLE_LEN) % PARASHA_CYCLE_LEN;
  if(diff===0) diff = PARASHA_CYCLE_LEN;
  return diff;
}

function defaultSplit(total){
  let base = Math.floor(total/7), rem = total % 7;
  let arr = new Array(7).fill(base);
  for(let i=0;i<rem;i++) arr[6-i]+=1;
  for(let i=0;i<7;i++) if(arr[i]<3) arr[i]=3;
  return arr;
}

// ---------- state ----------

// ---------- date helpers ----------
function nextSaturdayISO(){
  const d = new Date();
  const day = d.getDay();
  const diff = (6 - day + 7) % 7;
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function formatDate(iso){
  if(!iso) return '';
  const parts = iso.split('-');
  if(parts.length!==3) return iso;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}
function genId(){ return 'w'+Math.random().toString(36).slice(2,9); }

// normalizes an Israeli-style local number (05X-XXXXXXX) or an already-international one
// into the digits-only format wa.me expects (country code, no + or leading 0)
function phoneToWhatsappDigits(phone){
  let digits = (phone||'').replace(/\D/g,'');
  if(!digits) return '';
  if(digits.startsWith('0')) digits = '972' + digits.slice(1);
  return digits;
}
// builds a YouTube search link for R' Nir Gahali's channel (Yemenite/Shami nusach readings),
// scoped by parasha + aliyah name. Not a guaranteed single exact video, but this channel is
// specific enough that the right video is normally the first or near-first result.
function youtubeSearchLinkForAliyah(parashaName, aliyahName){
  const query = `ניר גהלי קריאת פרשת ${parashaName} עולה ${aliyahName}`;
  return `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
}
const DEFAULT_WHATSAPP_TEMPLATE = 'שלום {שם}, אתה משובץ השבת לעלייה {עלייה} בפרשת {פרשה}. שבת שלום!\nלצפייה בקריאה (נוסח שאמי, ניר גהלי): {סרטון}';
function whatsappLinkForPerson(person, parashaName, aliyahName){
  const digits = phoneToWhatsappDigits(person.phone);
  if(!digits) return null;
  const template = STATE.whatsappTemplate || DEFAULT_WHATSAPP_TEMPLATE;
  const message = template
    .replace(/\{שם\}/g, person.name)
    .replace(/\{עלייה\}/g, aliyahName)
    .replace(/\{פרשה\}/g, parashaName)
    .replace(/\{סרטון\}/g, youtubeSearchLinkForAliyah(parashaName, aliyahName));
  return `https://wa.me/${digits}?text=${encodeURIComponent(message)}`;
}

// ---------- storage abstraction ----------
// Uses window.storage when running inside a Claude artifact (this conversation, for testing).
// Falls back to the browser's own localStorage when window.storage isn't available - which is
// what will actually run once this file is hosted on its own (e.g. GitHub Pages/Netlify) and
// opened directly in a regular browser. Same key names either way, so nothing else in the app
// needs to know or care which one is active.
const LS_PREFIX = 'shibutz-aliyot:';
const hasClaudeStorage = (typeof window!=='undefined' && !!window.storage);
const Store = {
  async get(key){
    if(hasClaudeStorage){
      try{ return await window.storage.get(key); }catch(e){ return null; }
    }
    try{
      const raw = localStorage.getItem(LS_PREFIX+key);
      return raw===null ? null : {key, value: raw};
    }catch(e){ return null; }
  },
  async set(key, value){
    if(hasClaudeStorage){
      try{ return await window.storage.set(key, value); }catch(e){ return null; }
    }
    try{
      localStorage.setItem(LS_PREFIX+key, value);
      return {key, value};
    }catch(e){ return null; }
  }
};

// ---------- live Hebrew-calendar lookup ----------
// Computes the parasha for every upcoming Shabbat over the next ~14 months, so we can look up
// the real date for ANY parasha the gabbai picks, not just the very next one.
// Primary method: a plain data fetch to Hebcal's public JSON API (a simple GET request, not a
// script/module load - this is far more likely to be permitted by any sandboxed preview than
// importing an executable library, and is exactly the same request a normal browser would make).
// Secondary fallback: Hebcal's own JS library via CDN, in case the API fetch is unreachable.
// Always uses the Israel reading schedule, per how this shul reads.
async function fetchUpcomingParasha(){
  if(await fetchViaHebcalApi()){ saveParashaCalendar(); render(); return; }
  if(await fetchViaHebcalLibrary()){ saveParashaCalendar(); render(); return; }
  if(STATE.calendarStatus!=='ok') STATE.calendarStatus = 'error'; // keep showing cached data if we have it
  render();
}
async function saveParashaCalendar(){
  try{ await Store.set('parashaCalendar', JSON.stringify({calendar:STATE.parashaCalendar, fetchedAt:new Date().toISOString()})); }catch(e){}
}

async function fetchViaHebcalApi(){
  try{
    const start = new Date(); start.setDate(start.getDate()-380);
    const end = new Date(); end.setDate(end.getDate()+200);
    const fmt = d => d.toISOString().slice(0,10);
    const url = `https://www.hebcal.com/hebcal?cfg=json&v=1&maj=off&min=off&mod=off&nx=off&mf=off&ss=off&s=on&start=${fmt(start)}&end=${fmt(end)}&i=on`;
    const res = await fetch(url);
    const data = await res.json();
    const calendar = (data.items||[])
      .filter(it=>it.category==='parashat')
      .map(it=>({ name: (it.hebrew||'').replace(/^פרשת\s+/,'').trim(), date: it.date }))
      .filter(c=>c.name);
    if(calendar.length===0) return false;
    STATE.parashaCalendar = calendar;
    const todayStr = fmt(new Date());
    STATE.suggestedParasha = calendar.find(c=>c.date>=todayStr) || calendar[calendar.length-1];
    STATE.calendarStatus = 'ok';
    return true;
  }catch(e){ return false; }
}

async function fetchViaHebcalLibrary(){
  try{
    const { HDate, getSedra, ParshaEvent } = await import('https://cdn.jsdelivr.net/npm/@hebcal/core/+esm');
    let d = new Date(); d.setDate(d.getDate()-380);
    const day = d.getDay();
    d.setDate(d.getDate() + ((6 - day + 7) % 7)); // land on a Saturday
    const calendar = [];
    for(let i=0; i<83; i++){ // ~380 days back through ~200 days forward
      const hd = new HDate(d);
      const info = getSedra(hd.getFullYear(), true).lookup(hd);
      if(info && !info.chag){
        const ev = new ParshaEvent(info);
        const name = (ev.render('he')||'').replace(/^פרשת\s+/,'').trim();
        calendar.push({ name, date: d.toISOString().slice(0,10) });
      }
      d.setDate(d.getDate()+7);
    }
    if(calendar.length===0) return false;
    STATE.parashaCalendar = calendar;
    const todayStr = new Date().toISOString().slice(0,10);
    STATE.suggestedParasha = calendar.find(c=>c.date>=todayStr) || calendar[calendar.length-1];
    STATE.calendarStatus = 'ok';
    return true;
  }catch(e){ return false; }
}

// Looks up the real upcoming date for a specific parasha name from the precomputed calendar.
// Falls back to the suggested/next date if the name isn't found within the lookahead window.
function getDateForParasha(name){
  const todayStr = new Date().toISOString().slice(0,10);
  const hit = (STATE.parashaCalendar||[]).find(c=>c.name===name && c.date>=todayStr);
  if(hit) return hit.date;
  return STATE.suggestedParasha ? STATE.suggestedParasha.date : nextSaturdayISO();
}
// Looks up the most recent PAST date a given parasha was read - used to default the date
// when backfilling a past week, so the gabbai doesn't have to remember/look it up manually.
function getPastDateForParasha(name){
  const todayStr = new Date().toISOString().slice(0,10);
  const matches = (STATE.parashaCalendar||[]).filter(c=>c.name===name && c.date<todayStr);
  return matches.length ? matches[matches.length-1].date : '';
}
// The parasha read on the most recent past Shabbat - a sensible default when opening the
// "add a past week" form for the first time.
function getMostRecentPastParasha(){
  const todayStr = new Date().toISOString().slice(0,10);
  const past = (STATE.parashaCalendar||[]).filter(c=>c.date<todayStr);
  return past.length ? past[past.length-1] : null;
}
// Most recent confirmed weeklyLog entry for the given parasha name, if any - a memory aid for
// the gabbai when picking who to assign, shown before he even hits "בצע שיבוץ".
function getPreviousAssignmentForParasha(name){
  const matches = STATE.weeklyLog.filter(w=>w.parasha===name).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return matches.length ? matches[0] : null;
}

function csvEscape(val){
  const s = String(val==null?'':val);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function exportHistoryCsv(){

  const sorted = STATE.weeklyLog.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  for(const w of sorted){
    for(let i=1;i<=7;i++){

      if(!id) continue;
      const person = resolvePerson(id);
      rows.push([formatDate(w.date), w.parasha, ALIYAH_NAMES[i-1], person ? person.name : '—']);
    }
  }
  const csv = '\uFEFF' + rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});

// splits one CSV line respecting double-quoted fields (mirrors csvEscape's quoting above)
function parseCsvLine(line){
  const result = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQuotes){
      if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQuotes=false; }
      else cur+=ch;
    } else {
      if(ch==='"') inQuotes=true;
      else if(ch===','){ result.push(cur); cur=''; }
      else cur+=ch;
    }
  }
  result.push(cur);
  return result;
}
// Parses a roster CSV (header row: שם,טווח פסוקים,טלפון - "חזק" in the level column marks a
// strong/unrestricted reader) WITHOUT touching STATE yet - matched against existing congregants
// by exact name. The caller shows this as a confirm-summary before calling applyCongregantsCsv,
// so a bad paste can't silently corrupt the real roster.
function parseCongregantsCsv(text){
  text = text.replace(/^﻿/, '');
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
  if(lines.length<2) return {toAdd:[], toUpdate:[], skipped:0};
  lines.shift(); // header row
  const toAdd = [], toUpdate = [];
  let skipped = 0;
  for(const line of lines){
    const cols = parseCsvLine(line);
    const name = (cols[0]||'').trim();
    if(!name){ skipped++; continue; }
    const levelRaw = (cols[1]||'').trim();
    const phone = (cols[2]||'').trim();
    const unrestricted = /^(חזק|strong)$/i.test(levelRaw);
    const level = unrestricted ? 100 : (parseInt(levelRaw)||20);
    const existing = STATE.congregants.find(c=>c.name===name);
    if(existing) toUpdate.push({existing, level, unrestricted, phone});
    else toAdd.push({name, level, unrestricted, phone});
  }
  return {toAdd, toUpdate, skipped};
}
function applyCongregantsCsv(parsed){
  for(const u of parsed.toUpdate){
    u.existing.level = u.level;
    u.existing.unrestricted = u.unrestricted;
    if(u.phone) u.existing.phone = u.phone;
  }
  for(const a of parsed.toAdd){
    STATE.congregants.push({ id:'c'+Math.random().toString(36).slice(2,9), name:a.name, level:a.level, baseTotal:0, unrestricted:a.unrestricted, phone:a.phone });
  }
  saveCongregants();
}

function getBaselineSplit(name){
  if(PARASHOT_VERIFIED[name]) return PARASHOT_VERIFIED[name];
  const found = PARASHOT_DEFAULT_TOTALS.find(p=>p[0]===name);
  return defaultSplit(found ? found[1] : 105);
}
function arraysEqual(a,b){
  return a.length===b.length && a.every((v,i)=>v===b[i]);
}
function getSplit(name){
  if(STATE.parashot[name]) return STATE.parashot[name];
  return getBaselineSplit(name);
}
function getStatus(name){
  const override = STATE.parashot[name];
  const baseline = getBaselineSplit(name);
  const isRealOverride = override && !arraysEqual(override, baseline);
  if(isRealOverride) return {label:'מותאם ידנית', cls:'pill-gold'};
  if(PARASHOT_VERIFIED[name]) return {label:'מאומת ✓', cls:'pill-good'};
  return {label:'משוער - טרם אומת', cls:'pill-warn'};
}
// describes exactly which aliyot were changed by a manual override, e.g. "א: 34→35"
function getOverrideDiff(name){
  const override = STATE.parashot[name];
  if(!override) return '';
  const baseline = getBaselineSplit(name);
  if(arraysEqual(override, baseline)) return '';
  const parts = [];
  for(let i=0;i<7;i++){
    if(override[i] !== baseline[i]) parts.push(`${HEB_LETTERS[i]}: ${baseline[i]}→${override[i]}`);
  }
  return parts.join(', ');
}

// ---------- derived congregant stats (computed from weeklyLog, never stored redundantly) ----------
// Stats are still fully derived from weeklyLog on every read (no redundant storage) - but instead
// of each getCongStats(id) call rescanning the whole log, buildStatsMap() walks weeklyLog ONCE and
// buckets entries by congregant id, then getCongStats(id) is just a map lookup. The cache is
// invalidated (statsCache=null) inside saveCongregants()/saveWeeklyLog(), which every mutation
// path already calls before render() - so there is no separate invalidation bookkeeping to keep in
// sync. This matters because fairnessCompare() (called from .sort() inside runAssignment) used to
// rescan the entire log on every single comparison.
function aggregateStatsFromLog(logEntries){
  const map = {};
  for(const c of STATE.congregants){
    map[c.id] = { entries: [], base: c.baseTotal||0 };
  }
  for(const w of logEntries){
    for(const k of Object.keys(w.assign||{})){
      const id = w.assign[k];
      if(map[id]) map[id].entries.push({date:w.date, parasha:w.parasha, aliyah:parseInt(k), weekId:w.id});
    }
  }
  const result = {};
  for(const id in map){
    const { entries, base } = map[id];
    entries.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
    result[id] = {
      total: base + entries.length,
      lastEntry: entries.length ? entries[entries.length-1] : null,
      history: entries.slice().reverse()
    };
  }
  return result;
}
let statsCache = null;
function invalidateStatsCache(){ statsCache = null; }
function buildStatsMap(){
  if(statsCache) return statsCache;
  statsCache = aggregateStatsFromLog(STATE.weeklyLog);
  return statsCache;
}
function getCongStats(id){
  const map = buildStatsMap();
  return map[id] || { total:0, lastEntry:null, history:[] };
}
// Stats as they stood strictly BEFORE a given date - used to explain a past week's decisions
// with the totals that were actually true at the time, not today's totals (which include
// everything read since, and would misrepresent who was "ahead in the queue" back then). Not
// cached - only used for the occasional "explain this past week" view, not a hot path.
function buildStatsMapAsOf(beforeDate){
  const priorLog = STATE.weeklyLog.filter(w => (w.date||'') < (beforeDate||''));
  return aggregateStatsFromLog(priorLog);
}

// ---------- assignment algorithm ----------
// A person should be matched to an aliyah close to the top of what they can handle -
// not "anything up to their max" (which wastes a strong reader on a tiny aliyah).
// Accepted window: 80%-110% of their stated max pasuk count.
// Resolves an assign-object value to a displayable person. Real congregants are looked up
// normally; a "guest:<name>" value represents a one-off guest reader typed in by the gabbai
// for that specific aliyah - a different person can be named each time, with no pasuk limit.
function resolvePerson(id){
  if(!id) return null;
  if(id.startsWith('guest:')){
    const name = id.slice(6);
    return { id, name: name ? `${name} (אורח)` : 'אורח (ללא שם)', unrestricted:true, isGuest:true, level:0 };
  }
  return STATE.congregants.find(c=>c.id===id) || null;
}

// How many parashot back (by fixed reading-cycle order, not calendar date) a person's last
// confirmed reading was from the given parasha. This is the real recency signal - see
// parashaGap's comment for why the date field alone isn't trustworthy enough to gate on.
function parashaGapSinceLastRead(stats, parashaName){
  if(!stats || !stats.lastEntry || !stats.lastEntry.parasha) return Infinity;
  return parashaGap(stats.lastEntry.parasha, parashaName);
}
// Iron rule (no exceptions, ever): the immediately preceding parasha (gap of 1) makes someone
// completely ineligible this week - not a low-priority option, not a last resort, invisible to
// the algorithm entirely. Callers filter pools with this before any fairness/fit logic runs.
function isRecencyBlocked(stats, parashaName){
  return parashaGapSinceLastRead(stats, parashaName) <= 1;
}
// Soft rule: a gap of 2 parashot back ("read within the last Shabbat beyond the immediately
// preceding one") is allowed if nothing better is available, but should surface a written
// warning to the gabbai rather than passing silently. 3+ parashot back (or never read) is the
// clean, unflagged case - "3 weeks and up is the ideal" per the rule as given.
function isRecencyWarning(stats, parashaName){
  const g = parashaGapSinceLastRead(stats, parashaName);
  return g > 1 && g < 3;
}
// Finds the best available candidate in a fairness-sorted pool for a given fit test, honoring the
// two recency rules above: prefers someone with a clean gap (3+ parashot / never read); only
// falls back to someone in the 2-parashot warning zone if no clean candidate fits. The pool
// itself must already exclude anyone hard-blocked (gap of 1) - see isRecencyBlocked - this
// function only chooses between the remaining two tiers.
function findFairCandidate(pool, usedSet, fitTest, parashaName){
  let person = pool.find(p => !usedSet.has(p.id) && fitTest(p) && !isRecencyWarning(getCongStats(p.id), parashaName));
  if(person) return { person, recentGap:false };
  person = pool.find(p => !usedSet.has(p.id) && fitTest(p));
  if(person) return { person, recentGap:true };
  return null;
}

function fits(person, pesukim){
  if(person.unrestricted) return true; // strong reader - no real ceiling, any aliyah is fair game
  const lowerPct = (STATE.matchSettings && STATE.matchSettings.lower) || 80;
  const upperPct = (STATE.matchSettings && STATE.matchSettings.upper) || 110;
  const min = person.level * (lowerPct/100);
  const max = person.level * (upperPct/100);
  return pesukim >= min - 1e-6 && pesukim <= max + 1e-6;
}

// Real (not simulated) flexibility measure for a hypothetical lower/upper % range: across every
// known parasha's real aliyah split, how many active normal readers could ever cover each aliyah,
// on average. Uses the exact same fits-window formula as fits() itself, so it's a direct read on
// the live algorithm's slack, not a guess - a wider range/more overlap between people's ranges
// means fewer aliyot get stuck with zero fitting readers, which is what actually drives the
// fairness spread down. Used by the fairness tab's what-if sliders.
function computeFlexibilityScore(lowerPct, upperPct){
  const normalActive = STATE.congregants.filter(c=>!c.unrestricted && !c.paused);
  if(normalActive.length===0) return 0;
  let totalFits = 0, totalSlots = 0;
  for(const [name] of PARASHOT_DEFAULT_TOTALS){
    for(const pesukim of getSplit(name)){
      totalSlots++;
      for(const c of normalActive){
        const lo = c.level*(lowerPct/100), hi = c.level*(upperPct/100);
        if(pesukim >= lo-1e-6 && pesukim <= hi+1e-6) totalFits++;
      }
    }
  }
  return totalSlots ? totalFits/totalSlots : 0;
}

function fairnessCompare(a, b){
  const sa = getCongStats(a.id), sb = getCongStats(b.id);
  if(sa.total !== sb.total) return sa.total - sb.total;
  const aNever = sa.lastEntry ? 1:0, bNever = sb.lastEntry ? 1:0;
  if(aNever !== bNever) return aNever - bNever;
  return Math.random() - 0.5;
}
// Same ordering as fairnessCompare, but with a deterministic (alphabetical) tiebreak instead of
// Math.random() - used only for DISPLAYING the queue on the fairness-queue tab, so the list
// doesn't visibly reshuffle itself on every render. The real algorithm keeps its random tiebreak
// on purpose (see fairnessCompare) - this never touches an actual assignment, display only.
// Takes an explicit statsMap so a past week can be sorted by the totals as they stood back then
// (see buildStatsMapAsOf), not by today's totals.
function fairnessCompareStable(a, b, statsMap){
  const sa = statsMap[a.id] || {total:0, lastEntry:null}, sb = statsMap[b.id] || {total:0, lastEntry:null};
  if(sa.total !== sb.total) return sa.total - sb.total;
  const aNever = sa.lastEntry ? 1:0, bNever = sb.lastEntry ? 1:0;
  if(aNever !== bNever) return aNever - bNever;
  return a.name.localeCompare(b.name, 'he');
}
// Explains, for one normal congregant, exactly why a given week's assign object does or doesn't
// include them - reusing the exact same fits()/deferred logic the algorithm itself runs on, so
// the explanation can never drift from what actually happened. See runAssignment for the proof
// this leans on: if a person is unused and their range fits an aliyah, that aliyah could only
// have gone to someone equal-or-earlier than them in the fairness queue (never to a strong
// reader, never left unfilled) - so "who has it and where do they stand" is always a complete
// answer. statsMap should be the totals as they stood BEFORE this specific week (buildStatsMapAsOf
// for a confirmed past week, buildStatsMap() for the still-open draft) so the numbers shown match
// what the algorithm actually saw, not today's totals.
function explainQueuePerson(person, weekEntry, split, statsMap){
  if(!weekEntry) return null;
  const assign = weekEntry.assign || {};
  for(let i=1;i<=7;i++){
    if((assign[i]||assign[String(i)]) === person.id){
      const warn = (weekEntry.recencyWarnings||{})[i] || (weekEntry.recencyWarnings||{})[String(i)];
      return {selected:true, aliyahNum:i, recencyWarning: warn || null};
    }
  }
  // iron rule: reading within the last week makes someone entirely invisible to the algorithm
  // this week (see runAssignment) - check this BEFORE the normal fit-based reasoning below, or
  // it would wrongly claim someone else was merely "earlier in the fairness queue" when the real
  // reason is the no-two-weeks-in-a-row rule, not fairness ranking.
  if(isRecencyBlocked(statsMap[person.id], weekEntry.parasha)){
    const lastParasha = statsMap[person.id].lastEntry.parasha;
    return {selected:false, reason:`קרא בפרשת ${lastParasha} - הפרשה הקודמת - כלל הברזל אוסר לשבץ שוב שבוע אחרי שבוע.`};
  }
  if(person.unrestricted){
    // strong readers have no pasuk range, so "not selected" never means a fit problem - it means
    // every aliyah that reached the strong-reader fallback this week (see runAssignment) was
    // already claimed by another strong reader earlier in their own fairness order, or normal
    // readers simply covered all 7 aliyot themselves and no fallback was ever needed.
    const strongWinners = [];
    for(let i=1;i<=7;i++){
      const id = assign[i]||assign[String(i)];
      if(!id || id.startsWith('guest:')) continue;
      const p = resolvePerson(id);
      if(p && p.unrestricted) strongWinners.push(p.name);
    }
    return strongWinners.length===0
      ? {selected:false, reason:'כל שבע העליות שובצו למתפללים רגילים בשבת הזו — לא נותרה עלייה לקוראים חזקים.'}
      : {selected:false, reason:`העלייה שנותרה לקוראים חזקים בשבת הזו ניתנה ל${strongWinners.join(', ')}, שקודם/קודמים לו בתור הקוראים החזקים.`};
  }
  if((weekEntry.deferred||[]).includes(person.id)){
    return {selected:false, reason:'אין עלייה שמתאימה לטווח היכולת שלו בשבת הזו.'};
  }
  const fittingAliyot = [];
  for(let i=1;i<=7;i++){ if(fits(person, split[i-1])) fittingAliyot.push(i); }
  if(fittingAliyot.length===0){
    return {selected:false, reason:'אין עלייה שמתאימה לטווח היכולת שלו בשבת הזו.'};
  }
  // an aliyah that fits him and is still open is the most useful thing to surface - directly actionable
  for(const i of fittingAliyot){
    if(!(assign[i]||assign[String(i)])){
      return {selected:false, actionable:true, aliyahNum:i, reason:`עלייה ${ALIYAH_NAMES[i-1]} מתאימה לו וטרם שובצה — אפשר לשבץ אותו אליה ידנית.`};
    }
  }
  // otherwise, every aliyah that fits him already went to someone else in the queue
  const i = fittingAliyot[0];
  const takenId = assign[i] || assign[String(i)];
  const taken = resolvePerson(takenId);
  if(taken && taken.isGuest){
    return {selected:false, reason:`עלייה ${ALIYAH_NAMES[i-1]} מתאימה לו, אבל ניתנה לאורח.`};
  }
  if(taken){
    const takenStats = statsMap[taken.id] || {total:0}, meStats = statsMap[person.id] || {total:0};
    return {selected:false, reason:`עלייה ${ALIYAH_NAMES[i-1]} מתאימה לו, אבל ניתנה ל${taken.name} (${takenStats.total} עליות אז, לעומת ${meStats.total} שלו — קודם לו בתור ההוגנות).`};
  }
  return {selected:false, reason:`עלייה ${ALIYAH_NAMES[i-1]} מתאימה לו, אך לא שובצה.`};
}

function runAssignment(parashaName, date, locks){
  locks = locks || {};
  const split = getSplit(parashaName);
  let assign = {...locks};
  const lockedCongIds = new Set(Object.values(locks).filter(v=>v && !v.startsWith('guest:')));
  let remaining = split
    .map((p,i)=>({aliyahNum:i+1, pesukim:p}))
    .filter(a=>!assign[a.aliyahNum]);
  remaining.sort((a,b)=> (b.pesukim - a.pesukim) || (Math.random()-0.5)); // hardest first

  // Iron rule: reading last week makes someone entirely ineligible this week, no exceptions -
  // filtered out of both pools before anything else runs. Locked people (explicit manual
  // overrides, e.g. a bar mitzvah) are a deliberate exception to everything, recency included.
  const strongPool = STATE.congregants.filter(c=>c.unrestricted && !c.paused && !lockedCongIds.has(c.id) && !isRecencyBlocked(getCongStats(c.id), parashaName)).sort(fairnessCompare);
  const normalPool = STATE.congregants.filter(c=>!c.unrestricted && !c.paused && !lockedCongIds.has(c.id) && !isRecencyBlocked(getCongStats(c.id), parashaName)).sort(fairnessCompare);
  const recentlyExcluded = STATE.congregants
    .filter(c=>!c.paused && !lockedCongIds.has(c.id) && isRecencyBlocked(getCongStats(c.id), parashaName))
    .map(c=>c.id);
  const usedNormal = new Set();
  const usedStrong = new Set();
  let unfilledReasons = {};
  let recencyWarnings = {};
  // Tracked by PERSON, not by aliyahNum - the local-fit swap pass below can move a flagged
  // person to a different aliyahNum after this loop runs, and the warning must follow them.
  const recentGapPeople = new Set();

  // The hardest aliyah any normal (banded) reader in the community could ever be given - used to
  // tell "too hard for anyone normal, a strong reader is genuinely needed" apart from "just
  // happens to be too short/awkward for whoever's available right now, gabbai should decide".
  // Deliberately computed from the FULL roster, not normalPool - normalPool is filtered down by
  // this week's locks and the recency rule, so using it here would make the "ceiling" shrink
  // whenever enough higher-level readers happen to be excluded this week, mislabeling an
  // perfectly ordinary aliyah as "exceeds everyone's ability" when it only exceeds who's
  // available right now.
  const upperPct = (STATE.matchSettings && STATE.matchSettings.upper) || 110;
  const allNormalLevels = STATE.congregants.filter(c=>!c.unrestricted && !c.paused).map(c=>c.level);
  const maxNormalCeiling = allNormalLevels.length ? Math.max(...allNormalLevels.map(lvl=>lvl*(upperPct/100))) : 0;

  // Going hardest aliyah first: give it to a normal (banded) reader if some normal reader's band
  // actually reaches it. Strong readers are full participants in the rotation, not a rare
  // emergency valve - but they have a soft preferred floor (matchSettings.strongMin, default 30
  // pesukim) so a due strong reader doesn't routinely end up with whatever tiny aliyah nobody
  // else wanted. Phase 1 (here): a strong reader only steps in for an aliyah at/above that floor.
  // Phase 2 (below): only strong readers still unused after phase 1 get matched to whatever's
  // left, largest-first - so the floor is a genuine preference that degrades gracefully, not a
  // hard wall that leaves them unassigned on a week with nothing long.
  const strongMinPesukim = (STATE.matchSettings && STATE.matchSettings.strongMin) || 30;
  const stillOpen = [];
  for(const aliyah of remaining){
    const normalFound = findFairCandidate(normalPool, usedNormal, p=>fits(p, aliyah.pesukim), parashaName);
    if(normalFound){
      assign[aliyah.aliyahNum] = normalFound.person.id;
      usedNormal.add(normalFound.person.id);
      if(normalFound.recentGap) recentGapPeople.add(normalFound.person.id);
      continue;
    }
    if(aliyah.pesukim >= strongMinPesukim){
      const strongFound = findFairCandidate(strongPool, usedStrong, ()=>true, parashaName);
      if(strongFound){
        assign[aliyah.aliyahNum] = strongFound.person.id;
        usedStrong.add(strongFound.person.id);
        if(strongFound.recentGap) recentGapPeople.add(strongFound.person.id);
        continue;
      }
    }
    stillOpen.push(aliyah); // either below the strong-reader floor, or no strong reader free (yet)
  }

  // Phase 2: any strong reader still unused gets the largest remaining open aliyah, even if it's
  // below the preferred floor - degrading gradually instead of jumping straight to "unassigned".
  stillOpen.sort((a,b)=> b.pesukim - a.pesukim);
  const trulyUnfilled = [];
  for(const aliyah of stillOpen){
    const strongFound = findFairCandidate(strongPool, usedStrong, ()=>true, parashaName);
    if(strongFound){
      assign[aliyah.aliyahNum] = strongFound.person.id;
      usedStrong.add(strongFound.person.id);
      if(strongFound.recentGap) recentGapPeople.add(strongFound.person.id);
    } else {
      trulyUnfilled.push(aliyah); // no strong readers left either - genuinely needs a human
    }
  }

  // ---------- local-fit optimization pass ----------
  // The greedy hardest-first loop above guarantees everyone picked is a valid fit and that WHO
  // gets picked always respects fairness order - but processing order can still leave two
  // people's aliyot "crossed" (e.g. a higher-level reader stuck with the smaller of two aliyot
  // while a lower-level reader holds the larger one), or a strong reader parked on the smallest
  // aliyah in the parasha just because it was the only one still open when their turn came - even
  // though swapping them would fit each of them better and breaks no rule at all. This pass only
  // ever swaps aliyot BETWEEN two people already selected this week, so it never changes WHO is
  // used - fairness/queue order for future weeks is completely unaffected, only how well the SIZE
  // of what they got matches them. A normal reader's target is their own level (roughly the
  // center of their allowed band); a strong reader's target is the largest aliyah in the parasha,
  // since the whole point of treating them as full participants is that they take on the biggest
  // reading available, not whatever was left over by the time normal readers finished picking.
  const maxPesukimThisWeek = Math.max(...split);
  const misfit = (person, pesukim) => person.unrestricted ? (maxPesukimThisWeek - pesukim) : Math.abs(pesukim - person.level);
  const swappableAliyot = Object.keys(assign)
    .map(k=>parseInt(k,10))
    .filter(num => !locks[num] && assign[num] && !String(assign[num]).startsWith('guest:'));
  let improved = true, guard = 0;
  while(improved && guard++ < 30){
    improved = false;
    for(let i=0;i<swappableAliyot.length;i++){
      for(let j=i+1;j<swappableAliyot.length;j++){
        const numA = swappableAliyot[i], numB = swappableAliyot[j];
        const personA = resolvePerson(assign[numA]), personB = resolvePerson(assign[numB]);
        if(!personA || !personB) continue;
        const pesukimA = split[numA-1], pesukimB = split[numB-1];
        if(!personA.unrestricted && !fits(personA, pesukimB)) continue;
        if(!personB.unrestricted && !fits(personB, pesukimA)) continue;
        const before = misfit(personA, pesukimA) + misfit(personB, pesukimB);
        const after = misfit(personA, pesukimB) + misfit(personB, pesukimA);
        if(after < before - 1e-9){
          assign[numA] = personB.id;
          assign[numB] = personA.id;
          improved = true;
        }
      }
    }
  }
  // Rebuild recencyWarnings from the final (post-swap) aliyahNum each flagged person landed on.
  if(recentGapPeople.size){
    Object.keys(assign).forEach(k=>{
      const id = assign[k];
      if(id && recentGapPeople.has(id)){
        const p = resolvePerson(id);
        recencyWarnings[k] = `${p.name} קרא לאחרונה לפני פחות מ-3 שבתות - זו הייתה האפשרות הכי טובה שנמצאה, כדאי לשים לב.`;
      }
    });
  }

  for(const aliyah of trulyUnfilled){
    const tooHardForCommunity = aliyah.pesukim > maxNormalCeiling;
    if(tooHardForCommunity){
      unfilledReasons[aliyah.aliyahNum] = 'עלייה זו חורגת מיכולת כל מתפלל רגיל, וכל המתפללים החזקים כבר שובצו לעליות אחרות השבוע - נדרש שיבוץ ידני.';
      continue;
    }
    // Not too hard for the community - give the REAL breakdown of why nobody stepped in, checked
    // against the full roster (not the this-week-filtered pools), so the reason is always
    // accurate: e.g. "3 fit but already got a different aliyah this week, 2 fit but read
    // recently" - not a generic guess.
    const fittingWholeRoster = STATE.congregants.filter(c=>!c.unrestricted && !c.paused && fits(c, aliyah.pesukim));
    const usedElsewhereCount = fittingWholeRoster.filter(c=>usedNormal.has(c.id)).length;
    const blockedByRecencyCount = fittingWholeRoster.filter(c=>recentlyExcluded.includes(c.id)).length;
    const parts = [];
    if(usedElsewhereCount) parts.push(`${usedElsewhereCount} כבר שובצו לעליות אחרות השבוע`);
    if(blockedByRecencyCount) parts.push(`${blockedByRecencyCount} קראו לאחרונה ונחסמו לפי כלל הברזל`);
    const detail = parts.length ? ` (${parts.join(', ')})` : '';
    unfilledReasons[aliyah.aliyahNum] = `אין מתפלל רגיל פנוי שמתאים לעלייה זו כרגע${detail}, וכל המתפללים החזקים כבר שובצו השבוע לעליות אחרות - נדרש שיבוץ ידני.`;
  }

  // deferred = normal readers whose band doesn't reach ANY aliyah in this week's parasha at all
  // (not simply "someone else with priority took the one aliyah that also fit them")
  const deferred = normalPool
    .filter(p=>!usedNormal.has(p.id) && !split.some(pesukim=>fits(p, pesukim)))
    .map(p=>p.id);

  STATE.current = { date, parasha: parashaName, assign, deferred, unfilledReasons, recencyWarnings, recentlyExcluded, confirmed:false };
  saveCurrent();
}

function confirmAssignment(){
  if(!STATE.current) return;
  const dup = STATE.weeklyLog.find(w=>w.parasha===STATE.current.parasha && w.date===STATE.current.date);
  if(dup){
    askConfirm(`הפרשה ${STATE.current.parasha} כבר משובצת בתאריך ${formatDate(STATE.current.date)}. האם לעדכן (הדריסה תחליף לגמרי את השיבוץ הקיים באחד החדש)?`, ()=>{
      STATE.weeklyLog = STATE.weeklyLog.filter(w=>w.id!==dup.id); // remove the old one - no duplicate allowed
      doConfirmAssignment();
    });
    return; // cancelling the confirm modal leaves the draft open, untouched, and nothing is saved
  }
  doConfirmAssignment();
}
function doConfirmAssignment(){
  const entry = {
    id: genId(),
    date: STATE.current.date,
    parasha: STATE.current.parasha,
    assign: {...STATE.current.assign},
    deferred: [...STATE.current.deferred],
    unfilledReasons: {...(STATE.current.unfilledReasons||{})},
    recencyWarnings: {...(STATE.current.recencyWarnings||{})},
    recentlyExcluded: [...(STATE.current.recentlyExcluded||[])]
  };
  STATE.weeklyLog.push(entry);
  saveWeeklyLog();
  STATE.current = null;
  saveCurrent();
  STATE.tab = 'recent';
  render();
}

// edits a week already saved in the log (works for past confirmed weeks too)
function updateLogAssignment(weekId, aliyahNum, newCongId){
  const entry = STATE.weeklyLog.find(w=>w.id===weekId);
  if(!entry) return;
  if(newCongId) entry.assign[aliyahNum] = newCongId;
  else delete entry.assign[aliyahNum];
  saveWeeklyLog();
  render();
}

// ---------- rendering ----------
function askConfirm(message, onConfirm){
  STATE.confirmModal = {message, onConfirm};
  render();
}
function notice(message){
  STATE.noticeModal = message;
  render();
}
function renderNoticeModal(){
  const backdrop = el(`<div class="modal-backdrop"></div>`);
  backdrop.innerHTML = `
    <div class="modal">
      <div class="note" style="font-size:14px;color:var(--ink);margin-top:0;">${STATE.noticeModal}</div>
      <div class="modal-actions">
        <button class="btn btn-gold" id="noticeOk" style="flex:1;">אישור</button>
      </div>
    </div>
  `;
  setTimeout(()=>{
    backdrop.querySelector('#noticeOk').onclick = ()=>{ STATE.noticeModal=null; render(); };
  },0);
  return backdrop;
}
function renderConfirmModal(){
  const {message, onConfirm} = STATE.confirmModal;
  const backdrop = el(`<div class="modal-backdrop"></div>`);
  backdrop.innerHTML = `
    <div class="modal">
      <h3>אישור פעולה</h3>
      <div class="note" style="font-size:14px;color:var(--ink);">${message}</div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="confirmNo">ביטול</button>
        <button class="btn btn-danger" id="confirmYes" style="border:none;background:var(--warn);color:#fff;">כן, בצע</button>
      </div>
    </div>
  `;
  setTimeout(()=>{
    backdrop.querySelector('#confirmNo').onclick = ()=>{ STATE.confirmModal=null; render(); };
    backdrop.querySelector('#confirmYes').onclick = ()=>{
      STATE.confirmModal=null;
      onConfirm();
    };
  },0);
  return backdrop;
}

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }

// render() rebuilds the entire DOM from scratch on every state change, including per-keystroke
// on live-filter text inputs (recentSearchInput, peopleSearchInput) - without restoring focus
// afterward, the input the gabbai is actively typing into gets destroyed and recreated on every
// character, silently dropping keyboard focus (confirmed while building the new search field;
// the pre-existing archive search had the same latent bug). Captured before rebuild, restored
// after by matching element id + text-selection range.
let lastRenderedTab = null;
function render(){
  const app = document.getElementById('app');
  if(!STATE.loaded){ app.innerHTML = `<div class="empty-state">טוען...</div>`; return; }

  const activeEl = document.activeElement;
  const focusId = activeEl && activeEl.id;
  const hasSelectionRange = focusId && 'selectionStart' in activeEl;
  const selStart = hasSelectionRange ? activeEl.selectionStart : null;
  const selEnd = hasSelectionRange ? activeEl.selectionEnd : null;

  const isTabSwitch = STATE.tab !== lastRenderedTab;
  lastRenderedTab = STATE.tab;

  app.innerHTML = `
    <header class="top">
      <div class="brand">
        <div class="brand-mark">
          <svg width="46" height="46" viewBox="0 0 46 46" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#C7A05C"/>
                <stop offset="1" stop-color="#8F6B2E"/>
              </linearGradient>
            </defs>
            <rect x="6" y="7" width="7" height="32" rx="3.5" fill="url(#rod)"/>
            <rect x="33" y="7" width="7" height="32" rx="3.5" fill="url(#rod)"/>
            <rect x="12" y="14" width="22" height="18" rx="2" fill="#FBF6E9"/>
            <line x1="16" y1="19" x2="30" y2="19" stroke="#7C3F34" stroke-width="1.4"/>
            <line x1="16" y1="23" x2="30" y2="23" stroke="#7C3F34" stroke-width="1.4"/>
            <line x1="16" y1="27" x2="24" y2="27" stroke="#7C3F34" stroke-width="1.4"/>
          </svg>
        </div>
        <div>
          <div class="eyebrow">בית כנסת נצח בנים</div>
          <h1>שיבוץ עליות לתורה</h1>
          <div class="subtitle">חלוקה הוגנת ומותאמת אישית לכל שבת</div>
        </div>
      </div>
      <nav class="tabs">
        <button data-tab="assign" class="${STATE.tab==='assign'?'active':''}">🗓️ שיבוץ השבוע</button>
        <button data-tab="recent" class="${STATE.tab==='recent'?'active':''}">📖 עליות אחרונות</button>
        <button data-tab="people" class="${STATE.tab==='people'?'active':''}">👥 מתפללים</button>
        <button data-tab="parashot" class="${STATE.tab==='parashot'?'active':''}">📜 פרשות ועליות</button>
        <button data-tab="fairness" class="${STATE.tab==='fairness'?'active':''}">⚖️ מאזן הוגנות</button>
        <button data-tab="queue" class="${STATE.tab==='queue'?'active':''}">🔍 תור ההוגנות</button>
      </nav>
    </header>
    <div id="content"></div>
  `;
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.onclick = ()=>{ STATE.tab = b.dataset.tab; render(); };
  });
  const content = document.getElementById('content');
  if(isTabSwitch) content.classList.add('tab-enter');

}

function countFilled(assignObj){
  let n = 0;
  for(let i=1;i<=7;i++){ if(assignObj[i] || assignObj[String(i)]) n++; }

// builds the editable 7-aliyah panel strip shared by "assign" (draft) and "recent" (saved weeks)
function buildWeekText(parashaName, dateISO, assignObj){
  const lines = [`פרשת ${parashaName} | שבת ${formatDate(dateISO)}`];
  for(let i=1;i<=7;i++){
    const id = assignObj[i] || assignObj[String(i)];
    const person = id ? resolvePerson(id) : null;
    const name = person ? person.name : '—';
    lines.push(`${ALIYAH_NAMES[i-1]} - ${name}`);
  }
  return lines.join('\n');
}
// looks up the Hebrew calendar date string (e.g. "כ״ה בתמוז תשפ״ו") for a Gregorian date,
// via Hebcal's date-converter API - used only for the printed sheet.
async function getHebrewDateString(dateISO){
  try{
    const url = `https://www.hebcal.com/converter?cfg=json&date=${dateISO}&g2h=1&strict=1`;
    const res = await fetch(url);
    const data = await res.json();
    return data.hebrew || '';
  }catch(e){ return ''; }
}

// read-only display of a confirmed week - no selects, just names, until "עריכה" is clicked
function buildWeekPanelsReadOnly(parashaName, assignObj, reasons){

    html += `

}

function buildWeekPanels(parashaName, assignObj, reasons, recencyWarnings){
  reasons = reasons || {};
  recencyWarnings = recencyWarnings || {};
  const split = getSplit(parashaName);
  // which aliyah number(s) each (non-guest) person currently holds this week -
  // used to fully block picking them anywhere else, not just warn about it
  const assignedAliyahOf = {};
  for(let k=1;k<=7;k++){
    const v = assignObj[k] || assignObj[String(k)];
    if(v && !v.startsWith('guest:')) (assignedAliyahOf[v] = assignedAliyahOf[v]||[]).push(k);
  }
  let html = '';
  for(let i=1;i<=7;i++){
    const pesukim = split[i-1];
    const assignedId = assignObj[i] || assignObj[String(i)] || '';
    const isGuest = assignedId.startsWith && assignedId.startsWith('guest:');
    const guestName = isGuest ? assignedId.slice(6) : '';
    const person = isGuest ? null : resolvePerson(assignedId);
    let mismatch = '';
    if(person && !fits(person, pesukim)){
      const lowerPct = (STATE.matchSettings && STATE.matchSettings.lower) || 80;
      const upperPct = (STATE.matchSettings && STATE.matchSettings.upper) || 110;
      const min = Math.round(person.level*(lowerPct/100)), max = Math.round(person.level*(upperPct/100));
      mismatch = pesukim > max
        ? `⚠ מעל היכולת (טווח מומלץ: ${min}–${max})`
        : `⚠ עלייה קלה מדי עבורו - "מבזבז" יכולת (טווח מומלץ: ${min}–${max})`;
    }
    const isDuplicate = assignedId && !isGuest && assignedAliyahOf[assignedId] && assignedAliyahOf[assignedId].length>1;
    const recencyNote = recencyWarnings[i] || recencyWarnings[String(i)] || '';
    const state = !assignedId ? 'empty' : (mismatch || isDuplicate || recencyNote) ? 'warning' : 'filled';
    html += `
      <div class="panel" data-state="${state}">
        <div class="seal"><div class="heb-letter">${HEB_LETTERS[i-1]}</div></div>
        <div class="aliyah-name">עולה ${ALIYAH_NAMES[i-1]}</div>
        <div class="pesukim">${pesukim} פסוקים</div>
        <select data-aliyah="${i}">
          <option value="">— לא שובץ —</option>
          ${STATE.congregants.slice().sort((a,b)=>a.name.localeCompare(b.name,'he')).map(c=>{
            const heldElsewhere = assignedAliyahOf[c.id] && assignedAliyahOf[c.id].some(k=>k!==i);
            return `<option value="${c.id}" ${assignedId===c.id?'selected':''} ${heldElsewhere?'disabled':''}>${c.name} ${c.unrestricted?'(קורא חזק)':`(עד ${c.level})`}${c.paused?' - מושהה':''}${heldElsewhere?' - משובץ לעלייה אחרת':''}</option>`;
          }).join('')}
          <option value="guest" ${isGuest?'selected':''}>👤 אורח (שם מותאם)</option>
        </select>
        ${isGuest ? `<input type="text" data-guestname="${i}" placeholder="שם האורח" value="${guestName}" style="margin-top:6px;font-size:13px;padding:6px 8px;">` : ''}
        ${(person && !isGuest) ? (()=>{
          const link = whatsappLinkForPerson(person, parashaName, ALIYAH_NAMES[i-1]);
          return link
            ? `<a class="btn btn-outline btn-sm" href="${link}" target="_blank" style="margin-top:8px;display:inline-block;">📱 שלח לו</a>`
            : `<div class="mini" style="margin-top:8px;">אין טלפון שמור</div>`;
        })() : ''}
        ${mismatch ? `<div class="mismatch">${mismatch}</div>`:''}
        ${isDuplicate ? `<div class="mismatch">⚠ מתפלל זה מופיע ביותר מעלייה אחת בנתונים - כדאי לתקן</div>`:''}
        ${recencyNote ? `<div class="mismatch">⏱ ${recencyNote}</div>`:''}
        ${(!assignedId && reasons[i]) ? `<div class="mismatch">ℹ ${reasons[i]}</div>`:''}
      </div>`;
  }
  return html;
}

function renderAssignTab(){
  const wrap = el(`<div></div>`);

  const lastConfirmedDate = STATE.weeklyLog.length
    ? STATE.weeklyLog.map(w=>w.date).filter(Boolean).sort().slice(-1)[0]
    : null;
  if(lastConfirmedDate){
    const daysSince = Math.floor((new Date() - new Date(lastConfirmedDate)) / (1000*60*60*24));
    if(daysSince > 8){
      const reminder = el(`<div class="card" style="border-color:var(--warn);"></div>`);
      reminder.innerHTML = `<div class="note" style="color:var(--warn);font-weight:700;">⏰ עברו ${daysSince} ימים מאז השיבוץ האחרון שאושר (${formatDate(lastConfirmedDate)}) — כדאי לבצע שיבוץ לשבת הקרובה.</div>`;
      wrap.appendChild(reminder);
    }
  } else if(STATE.loaded){
    const reminder = el(`<div class="card" style="border-color:var(--warn);"></div>`);
    reminder.innerHTML = `<div class="note" style="color:var(--warn);font-weight:700;">⏰ עדיין לא בוצע שום שיבוץ מאושר. כדאי לבצע שיבוץ לשבת הקרובה.</div>`;
    wrap.appendChild(reminder);
  }

  const card = el(`<div class="card"></div>`);

  const suggestionValid = STATE.suggestedParasha && PARASHOT_DEFAULT_TOTALS.some(p=>p[0]===STATE.suggestedParasha.name);
  const calendarOk = STATE.calendarStatus==='ok' && suggestionValid;
  const fallbackName = suggestionValid ? STATE.suggestedParasha.name : PARASHOT_DEFAULT_TOTALS[0][0];
  const effectiveParasha = STATE.current ? STATE.current.parasha : (STATE.pendingParasha || fallbackName);
  const effectiveDate = STATE.current ? STATE.current.date
    : calendarOk ? getDateForParasha(effectiveParasha)
    : (STATE.pendingDate || nextSaturdayISO());

  let calendarNote;
  if(STATE.calendarStatus==='loading'){
    calendarNote = `<div class="note">🔄 טוען את הלוח העברי...</div>`;
  } else if(!calendarOk){
    calendarNote = `<div class="note">⚠ הלוח העברי האוטומטי לא זמין כרגע (למשל אם אין חיבור לאינטרנט) — נא לבחור פרשה ותאריך ידנית. ברוב המקרים זה יעבוד אוטומטית ברגע שהאתר יפעל מחוץ לתצוגה המקדימה כאן.</div>`;
  }

  card.innerHTML = `<h2>בחירת פרשת השבוע</h2>
    ${calendarNote||''}
    ${STATE.current ? `<div class="note">יש כרגע טיוטת שיבוץ פתוחה ל-${STATE.current.parasha}. בחירת פרשה אחרת תבטל אותה ותתחיל טיוטה חדשה.</div>` : ''}
    <div class="row-flex">
      <div>
        <label>פרשה</label>
        <select id="parashaSelect">
          ${PARASHOT_DEFAULT_TOTALS.map(p=>`<option value="${p[0]}" ${effectiveParasha===p[0] ? 'selected':''}>${p[0]}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>תאריך השבת</label>
        ${calendarOk
          ? `<div class="date-pill">${formatDate(effectiveDate)}</div>`
          : `<input type="date" id="dateInput" value="${effectiveDate}">`}
      </div>
      <div style="flex:0 0 auto;">
        <button class="btn btn-gold btn-start" id="startBtn">בצע שיבוץ</button>
      </div>
    </div>
  `;
  wrap.appendChild(card);

  if(!STATE.current){
    const prev = getPreviousAssignmentForParasha(effectiveParasha);
    if(prev){
      const prevCard = el(`<div class="card"></div>`);
      const prevLines = [];
      for(let i=1;i<=7;i++){
        const id = prev.assign[i] || prev.assign[String(i)];
        const person = id ? resolvePerson(id) : null;
        if(person) prevLines.push(`${ALIYAH_NAMES[i-1]} - ${person.name}`);
      }
      prevCard.innerHTML = `<h2 style="font-size:15px;">📖 בפעם הקודמת שנקראה פרשת ${effectiveParasha}</h2>
        <div class="note" style="margin-top:0;">${formatDate(prev.date)} · ${prevLines.join(' · ') || 'לא נשמרו פרטים'}</div>`;
      wrap.appendChild(prevCard);
    }

    const lockPanels = buildWeekPanels(effectiveParasha, STATE.pendingLocks);
    const lockCard = el(`<div class="card"></div>`);
    lockCard.innerHTML = `<h2>נעילת עלייה מסוימת (רשות)</h2>
      <div class="note">אם כבר ידוע מראש שמישהו חייב לקבל עלייה מסוימת (למשל בר מצווה) — בחר אותו כאן לפני "בצע שיבוץ". שאר העליות ישובצו הוגן כרגיל סביב הבחירה הזו.</div>
      <div class="week-strip">${lockPanels}</div>
      <div style="margin-top:12px;"><button class="btn btn-outline btn-sm" id="clearLocksBtn">נקה נעילות</button></div>

    setTimeout(()=>{

        sel.onchange = ()=>{

          const val = sel.value;
          if(val==='guest') STATE.pendingLocks[num] = 'guest:';
          else if(val) STATE.pendingLocks[num] = val;
          else delete STATE.pendingLocks[num];
          render();
        };

      lockCard.querySelectorAll('input[data-guestname]').forEach(inp=>{
        inp.onchange = ()=>{
          STATE.pendingLocks[inp.dataset.guestname] = 'guest:' + inp.value.trim();
          render();
        };
      });
      lockCard.querySelector('#clearLocksBtn').onclick = ()=>{ STATE.pendingLocks = {}; render(); };
    },0);
  }

  if(STATE.current){
    const panels = buildWeekPanels(STATE.current.parasha, STATE.current.assign, STATE.current.unfilledReasons, STATE.current.recencyWarnings);
    const filled = countFilled(STATE.current.assign);

    c2.innerHTML = `<h2>שיבוץ עליות — ${STATE.current.parasha} <span class="mini">${formatDate(STATE.current.date)}</span></h2>
      <div class="progress-bar"><div class="fill" style="width:${Math.round(filled/7*100)}%;"></div></div>
      <div class="progress-label">${filled}/7 עליות שובצו</div>
      ${recentNames.length ? `<div class="note" style="color:var(--warn);">⏱ לא נשקלו השבוע (קראו לפני שבוע או פחות - כלל ברזל): ${recentNames.join(', ')}.</div>` : ''}
      <div class="week-strip">${panels}</div>
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">

        <button class="btn btn-outline" id="waGroupBtn">📱 שלח לקבוצה</button>
        <button class="btn btn-outline" id="copyTextBtn">📋 העתק כטקסט</button>
        <button class="btn btn-outline" id="printBtn">🖨️ הדפסה</button>
        <button class="btn btn-outline" id="showQueueBtn">🔍 למה זה ככה?</button>
        <button class="btn btn-outline" id="resetAssignBtn">איפוס עליות</button>
      </div>

    setTimeout(()=>{
      c2.querySelector('#showQueueBtn').onclick = ()=>{ STATE.tab='queue'; render(); };
      c2.querySelectorAll('select[data-aliyah]').forEach(sel=>{
        sel.onchange = ()=>{
          const num = sel.dataset.aliyah;
          const val = sel.value;
          if(val==='guest') STATE.current.assign[num] = 'guest:';
          else if(val) STATE.current.assign[num] = val;

// shared between the desktop table and the mobile card list, so the two views can never drift
function lastReadCellFor(c, stats){
  const last = stats.lastEntry;
  if(last) return `<b>${last.date ? formatDate(last.date) : 'תאריך לא ידוע'}</b> · ${last.parasha}, עולה ${ALIYAH_NAMES[last.aliyah-1]}`;
  if(c.baseTotal>0) return 'תאריך מדויק לא תועד';
  return 'טרם עלה';
}
// shared threshold used by the people-tab pill, its spread indicator, and the fairness tab's
// ranking chart - kept in one place so the views can never disagree about who counts as
// "flagged". Strong readers are included on the same footing as everyone else (they're full
// participants in real assignment - see runAssignment's strong-reader fallback), so they can be
// flagged too if their count runs far above/below the group average.
function fairnessFlagDirection(c, stats, avgNormal, normalCount){
  if(avgNormal<=0 || normalCount<=3) return null;
  if(stats.total >= avgNormal*1.8) return 'high';
  if(stats.total <= avgNormal*0.4 && stats.total < avgNormal-3) return 'low';
  return null;
}
function imbalanceFlagFor(c, stats, avgNormal, normalCount){
  const dir = fairnessFlagDirection(c, stats, avgNormal, normalCount);
  if(dir==='high') return ` <span class="pill pill-warn" title="משמעותית מעל הממוצע (${avgNormal.toFixed(1)})">⚠ מעל הממוצע</span>`;
  if(dir==='low') return ` <span class="pill pill-warn" title="משמעותית מתחת לממוצע (${avgNormal.toFixed(1)})">⚠ מתחת לממוצע</span>`;
  return '';
}

function renderPeopleTab(){

  // in real assignment now, see runAssignment), used to flag anyone significantly above/below
  // the group - a sign that the % tolerance (or the strong-reader minimum) may be creating a
  // bottleneck (e.g. only one person's range covers a common aliyah length)
  const normalTotals = rowsWithStats.filter(r=>!r.c.paused).map(r=>r.stats.total);
  const avgNormal = normalTotals.length ? normalTotals.reduce((a,b)=>a+b,0)/normalTotals.length : 0;

  // fairness spread among the active rotation (everyone non-paused) - the live version of the
  // diagnostic that used to require a manual Node simulation to check (see handoff doc section 6.2)
  const activeNormal = rowsWithStats.filter(r=>!r.c.paused);
  let spreadHtml = '';
  if(activeNormal.length>1){
    const maxRow = activeNormal.reduce((a,b)=>a.stats.total>=b.stats.total?a:b);
    const minRow = activeNormal.reduce((a,b)=>a.stats.total<=b.stats.total?a:b);
    const spread = maxRow.stats.total - minRow.stats.total;
    spreadHtml = `<div class="stat-pill-row"><div class="stat-tile">📊 פער הוגנות: ${spread} עליות (מקסימום: ${maxRow.c.name} — ${maxRow.stats.total}; מינימום: ${minRow.c.name} — ${minRow.stats.total})</div></div>`;

      <div class="note">אופציונלי: אם ידוע לך על עלייה אחרונה ספציפית (כולל תאריך), אפשר לתעד אותה כאן — היא תופיע בהיסטוריה שלו.</div>
      <div class="row-flex">
        <div class="field"><label>תאריך</label><input type="date" id="f-lastDate"></div>
        <div class="field"><label>פרשה</label>
          <select id="f-lastParasha">
            <option value="">— אין —</option>
            ${PARASHOT_DEFAULT_TOTALS.map(p=>`<option value="${p[0]}">${p[0]}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>עלייה</label>
          <select id="f-lastAliyah">
            <option value="">—</option>
            ${ALIYAH_NAMES.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('')}
          </select>
        </div>
      </div>` : ''}
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelModal">ביטול</button>
        <button class="btn btn-gold" id="saveModal">שמירה</button>
      </div>
    </div>
  `;
  setTimeout(()=>{
    backdrop.querySelector('#f-unrestricted').onchange = (e)=>{
      backdrop.querySelector('#levelField').style.display = e.target.checked ? 'none' : '';
    };
    backdrop.querySelector('#pickContactBtn').onclick = async ()=>{
      if(!('contacts' in navigator && 'ContactsManager' in window)){
        notice('בחירה מאנשי קשר לא נתמכת בדפדפן/במכשיר הזה (עובד בעיקר בכרום באנדרואיד) - אפשר להזין את המספר ידנית בשדה.');
        return;
      }
      try{
        const contacts = await navigator.contacts.select(['name','tel'], {multiple:false});
        if(contacts && contacts.length){
          const c = contacts[0];
          if(c.tel && c.tel.length) document.getElementById('f-phone').value = c.tel[0];
          const nameField = document.getElementById('f-name');
          if(c.name && c.name.length && !nameField.value.trim()) nameField.value = c.name[0];
        }
      }catch(e){
        // user cancelled the picker - nothing to do
      }
    };
    backdrop.querySelector('#cancelModal').onclick = ()=>{ STATE.editingCongregant=null; render(); };
    backdrop.querySelector('#saveModal').onclick = ()=>{
      const name = document.getElementById('f-name').value.trim();
      const unrestricted = document.getElementById('f-unrestricted').checked;
      const level = unrestricted ? 100 : (parseInt(document.getElementById('f-level').value)||20);
      const phone = document.getElementById('f-phone').value.trim();
      if(!name){ notice('יש להזין שם'); return; }
      if(isNew){
        const newId = 'c'+Math.random().toString(36).slice(2,9);
        STATE.congregants.push({ id:newId, name, level, baseTotal:0, unrestricted, phone });
        const lastParasha = document.getElementById('f-lastParasha').value;
        const lastAliyah = document.getElementById('f-lastAliyah').value;
        const lastDate = document.getElementById('f-lastDate').value;
        if(lastParasha && lastAliyah){
          STATE.weeklyLog.push({
            id: genId(),
            date: lastDate || '',
            parasha: lastParasha,
            assign: { [lastAliyah]: newId },
            deferred: []
          });
          saveWeeklyLog();
        }
      }else{
        const p = STATE.congregants.find(c=>c.id===STATE.editingCongregant);
        p.name=name; p.level=level; p.unrestricted=unrestricted; p.phone=phone;
        // baseTotal is intentionally left untouched here - total reads come only from
        // actual weeklyLog entries (past-week backfill or ongoing confirmed assignments)
      }
      saveCongregants();
      STATE.editingCongregant=null;
      render();
    };
  },0);
  return backdrop;
}

function renderManualWeekModal(){

      render();
    };
    backdrop.querySelector('#mw-date').onchange = (e)=>{ draft.date = e.target.value; };

      sel.onchange = ()=>{
        const num = sel.dataset.aliyah;
        const val = sel.value;
        if(val==='guest') draft.assign[num] = 'guest:';
        else if(val) draft.assign[num] = val;
        else delete draft.assign[num];
        render();
      };
    });
    backdrop.querySelectorAll('input[data-guestname]').forEach(inp=>{
      inp.onchange = ()=>{
        draft.assign[inp.dataset.guestname] = 'guest:' + inp.value.trim();

    });

    backdrop.querySelector('#mw-save').onclick = ()=>{
      const dateVal = backdrop.querySelector('#mw-date').value;
      if(!dateVal){ notice('יש להזין תאריך'); return; }
      const doSave = ()=>{
        STATE.weeklyLog.push({
          id: genId(),
          date: dateVal,
          parasha: draft.parasha,
          assign: {...draft.assign},
          deferred: []
        });
        saveWeeklyLog();
        STATE.manualWeekDraft = null;
        render();
      };
      const dup = STATE.weeklyLog.find(w=>w.parasha===draft.parasha && w.date===dateVal);
      if(dup){
        askConfirm(`הפרשה ${draft.parasha} כבר קיימת בהיסטוריה בתאריך ${formatDate(dateVal)}. האם לעדכן (הדריסה תחליף לגמרי את הרשומה הקיימת)?`, ()=>{
          STATE.weeklyLog = STATE.weeklyLog.filter(w=>w.id!==dup.id);
          doSave();
        });
        return;
      }
      doSave();
    };
  },0);
  return backdrop;
}
