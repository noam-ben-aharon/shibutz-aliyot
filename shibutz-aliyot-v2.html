// Only paused congregants are left out of the balance tab - everyone else (including strong
// readers, who are full participants in real assignment, see runAssignment) is included on the
// same footing, so the chart never shows fewer names than the people tab without saying why.
function excludedCongregantsNote(){
  const pausedCount = STATE.congregants.filter(c=>c.paused).length;
  if(!pausedCount) return '';
  return `<div class="note">לא נכנסים לחישוב הזה: ${pausedCount} מתפללים מושהים.</div>`;
}

function renderFairnessTab(){
  const wrap = el(`<div></div>`);
  const card = el(`<div class="card"></div>`);

  const statsMap = buildStatsMap();
  const activeNormal = STATE.congregants.filter(c=>!c.paused);
  const rows = activeNormal
    .map(c=>({c, stats: statsMap[c.id] || {total:0, lastEntry:null, history:[]}}))
    .sort((a,b)=>b.stats.total - a.stats.total);
  const exclusionNote = excludedCongregantsNote();

  if(rows.length < 2){
    card.innerHTML = `<h2>⚖️ מאזן ההוגנות</h2>
      <div class="empty-state"><div class="big">אין עדיין מספיק מתפללים פעילים</div>המאזן מוצג רק כשיש לפחות שני מתפללים שאינם מושהים.</div>`;
    wrap.appendChild(card);
    return wrap;
  }

  const totals = rows.map(r=>r.stats.total);
  const avg = totals.reduce((a,b)=>a+b,0)/totals.length;
  const max = Math.max(...totals);
  const min = Math.min(...totals);
  const spread = max - min;
  const noDataYet = max === 0;

  const flaggedCount = rows.filter(r=>fairnessFlagDirection(r.c, r.stats, avg, rows.length)).length;
  const statusClass = noDataYet ? '' : (flaggedCount===0 ? 'status-good' : 'status-warn');
  const statusText = noDataYet ? 'אין עדיין נתונים' : (flaggedCount===0 ? 'מאוזן היטב' : `${flaggedCount} מתפללים שכדאי לשים לב אליהם`);

  const barMax = Math.max(max, 1);
  const avgPct = (avg/barMax*100).toFixed(1);

  const rankRowsHtml = rows.map(({c, stats})=>{
    const dir = fairnessFlagDirection(c, stats, avg, rows.length);
    const fillClass = dir==='high' ? 'flag-high' : dir==='low' ? 'flag-low' : '';
    const pct = (stats.total/barMax*100).toFixed(1);
    return `
      <div class="rank-row">
        <div class="rank-name">${c.name}</div>
        <div class="rank-track"><div class="rank-fill ${fillClass}" style="width:${pct}%"></div></div>
        <div class="rank-value">${stats.total}</div>
      </div>`;
  }).join('');

  const lower0 = STATE.fairnessSimLower!=null ? STATE.fairnessSimLower : STATE.matchSettings.lower;
  const upper0 = STATE.fairnessSimUpper!=null ? STATE.fairnessSimUpper : STATE.matchSettings.upper;
  const isCurrentSettings = lower0===STATE.matchSettings.lower && upper0===STATE.matchSettings.upper;
  const currentFlex = computeFlexibilityScore(STATE.matchSettings.lower, STATE.matchSettings.upper);
  const simFlex = isCurrentSettings ? currentFlex : computeFlexibilityScore(lower0, upper0);
  const flexDelta = simFlex - currentFlex;

  card.innerHTML = `
    <h2>⚖️ מאזן ההוגנות</h2>
    <div class="card-sub">כמה מאוזנת חלוקת העליות בין כל המתפללים הפעילים (כולל קוראים חזקים), ולמה.</div>
    ${exclusionNote}
    <div class="fairness-hero">
      <div class="fairness-seal"><div class="fs-num">${spread}</div><div class="fs-label">פער</div></div>
      <div>
        <div class="fairness-status ${statusClass}">${statusText}</div>
        ${noDataYet ? '' : `<div class="fairness-status-sub">הכי הרבה: ${rows[0].c.name} (${max}) · הכי מעט: ${rows[rows.length-1].c.name} (${min}) · ממוצע ${avg.toFixed(1)}</div>`}
      </div>
    </div>
    <div style="position:relative;margin-top:12px;">
      <div style="position:absolute; inset-inline-start:150px; inset-inline-end:44px; top:0; bottom:0;">
        <div class="rank-avg-line" style="right:${avgPct}%;"></div>
      </div>
      ${rankRowsHtml}
    </div>
    <div class="sim-strip">
      <div class="sim-slide">
        <label>אחוז תחתון <span id="simLowerVal">${lower0}%</span></label>
        <input type="range" id="simLowerSlider" min="50" max="95" step="5" value="${lower0}">
      </div>
      <div class="sim-slide">
        <label>אחוז עליון <span id="simUpperVal">${upper0}%</span></label>
        <input type="range" id="simUpperSlider" min="105" max="150" step="5" value="${upper0}">
      </div>
      <div class="sim-readout">
        גמישות שיבוץ${isCurrentSettings ? ' (המצב הנוכחי)' : ''}: <b>${simFlex.toFixed(2)}</b>
        ${isCurrentSettings ? '' : (flexDelta>=0
          ? `<div style="color:var(--good);">▲ ${flexDelta.toFixed(2)} לעומת היום</div>`
          : `<div style="color:var(--warn);">▼ ${Math.abs(flexDelta).toFixed(2)} לעומת היום</div>`)}
      </div>
      ${isCurrentSettings ? '' : `<div><button class="btn btn-gold btn-sm" id="applySimBtn">החל בפועל בהגדרות ההתאמה</button></div>`}
    </div>
    <div class="note">"גמישות שיבוץ" = כמה מתפללים רגילים, בממוצע, יכולים לכסות כל עלייה נתונה בטווח הזה (נמדד על פני 61 הפרשות האמיתיות, באותה נוסחת ההתאמה שהאלגוריתם עצמו משתמש בה — לא הערכה נפרדת). ככל שהמספר גבוה יותר, יש לאלגוריתם יותר מקום לאזן, מה שבדרך כלל מצמצם את הפער בטווח הארוך.</div>
  `;
  wrap.appendChild(card);
  setTimeout(()=>{
    const lowerSlider = document.getElementById('simLowerSlider');
    const upperSlider = document.getElementById('simUpperSlider');
    const lowerLabel = document.getElementById('simLowerVal');
    const upperLabel = document.getElementById('simUpperVal');
    // 'input' fires continuously while dragging - only touch the text label here (cheap DOM
    // update, doesn't disturb the slider node itself). A full render() mid-drag would replace the
    // slider element and silently break the browser's native drag/pointer-capture on it (the same
    // class of bug fixed for the text search inputs elsewhere in this file). The real STATE update
    // + recompute only happens on 'change', which fires once per completed drag or key press.
    lowerSlider.oninput = ()=>{
      let v = +lowerSlider.value;
      if(v > +upperSlider.value - 15){ v = +upperSlider.value - 15; lowerSlider.value = v; }
      lowerLabel.textContent = v + '%';
    };
    upperSlider.oninput = ()=>{
      let v = +upperSlider.value;
      if(v < +lowerSlider.value + 15){ v = +lowerSlider.value + 15; upperSlider.value = v; }
      upperLabel.textContent = v + '%';
    };
    lowerSlider.onchange = ()=>{ STATE.fairnessSimLower = +lowerSlider.value; render(); };
    upperSlider.onchange = ()=>{ STATE.fairnessSimUpper = +upperSlider.value; render(); };
    const applyBtn = document.getElementById('applySimBtn');
    if(applyBtn) applyBtn.onclick = ()=>{
      STATE.matchSettings = {lower:lower0, upper:upper0};
      saveMatchSettings();
      STATE.fairnessSimLower = null;
      STATE.fairnessSimUpper = null;
      render();
      notice('טווח ההתאמה עודכן בפועל.');
    };
  },0);
  return wrap;
}

  if(active.length===0){
    card.innerHTML = `<h2>🔍 תור ההוגנות</h2>
      <div class="empty-state"><div class="big">אין עדיין מתפללים פעילים</div>הטבלה מוצגת רק כשיש לפחות מתפלל אחד שאינו מושהה.</div>`;
    wrap.appendChild(card);
    return wrap;
  }

  const current = STATE.current;
  const liveStats = buildStatsMap();
  const queue = active.slice().sort((a,b)=>fairnessCompareStable(a,b, liveStats));
  const split = current ? getSplit(current.parasha) : null;

  const introNote = current
    ? `לפני שרצים שיבוץ, ההנחה הפשוטה היא שמקומות 1–7 בתור יקבלו את שבע העליות לפי הסדר. בפועל, טווח הפסוקים של כל אחד (או אין-טווח, אצל קוראים חזקים) קובע אם הוא באמת מתאים לעלייה שמגיעה אליו — מי שכן, מסומן ירוק ועובר לסוף התור; מי שלא, התור פשוט ממשיך למקום הבא (8, 9, וכן הלאה) עד שנמצא מישהו שמתאים. קוראים חזקים מקבלים עדיפות לעליות הארוכות ביותר, אבל אם השבת אין עלייה כזו הם עדיין משתבצים כרגיל.`
    : `זהו סדר העדיפות הנוכחי — מי שקרא הכי פחות פעמים נמצא ראשון, כולל קוראים חזקים. אחרי הרצת שיבוץ בטאב "שיבוץ השבוע", חוזרים לכאן ורואים בדיוק מי מהם התאים ומי לא, ולמה.`;

  const pausedCount = STATE.congregants.filter(c=>c.paused).length;
  const exclusionNote = pausedCount
    ? `<div class="note">לא מופיע כאן: ${pausedCount} מתפללים מושהים.</div>` : '';

  // a quick dashboard-style summary strip above the table - live numbers, not just a bare list
  const totals = queue.map(c=>(liveStats[c.id]||{total:0}).total);
  const spread = totals.length ? Math.max(...totals) - Math.min(...totals) : 0;
  const maxTotal = Math.max(1, ...totals);
  const statusTile = current
    ? `<div class="stat-tile">📝 טיוטה פתוחה: ${current.parasha} (${formatDate(current.date)})</div>`
    : `<div class="stat-tile">⏳ טרם הורץ שיבוץ לשבת הקרובה</div>`;
  const summaryHtml = `
    <div class="stat-pill-row">
      <div class="stat-tile">👥 ${queue.length} בתור</div>
      <div class="stat-tile">📊 פער נוכחי: ${spread} עליות</div>
      ${statusTile}
    </div>`;

  const rowsHtml = queue.map((c, idx)=>{
    const stats = liveStats[c.id] || {total:0, lastEntry:null};
    const total = stats.total;
    const info = current ? explainQueuePerson(c, current, split, liveStats) : null;
    let rowClass = '', pillClass = 'muted', pillLabel = 'טרם עלה', detail = '';
    if(info){
      if(info.selected){
        rowClass = 'row-selected';
        pillClass = 'good';
        pillLabel = `✓ נבחר — ${ALIYAH_NAMES[info.aliyahNum-1]}`;
        detail = 'עובר לסוף התור' + (info.recencyWarning ? ` · ⏱ ${info.recencyWarning}` : '');
      } else {
        rowClass = 'row-skip';
        pillClass = info.actionable ? 'pending' : 'muted';
        pillLabel = info.actionable ? 'פנוי לשיבוץ ידני' : 'לא התאים';
        detail = info.reason;
      }
    } else if(stats.lastEntry){
      // idle state (no draft open yet): showing "ממתין" on all 23 rows said nothing - real,
      // differentiated info (when each person last actually read) is far more useful here.
      pillLabel = 'קרא בעבר';
      detail = `לאחרונה: ${formatDate(stats.lastEntry.date)} · פרשת ${stats.lastEntry.parasha}`;
    }
    const barPct = (total / maxTotal * 100).toFixed(1);
    return `
      <tr class="${rowClass}" style="--i:${idx}">
        <td style="width:46px;"><div class="queue-rank-badge">${idx+1}</div></td>
        <td class="name-cell">
          <div class="queue-name-line"><b>${c.name}</b><span class="queue-total-pill">${total} עליות</span></div>
          <div class="queue-total-track"><div class="queue-total-fill" style="width:${barPct}%"></div></div>
        </td>
        <td class="queue-status-td">
          <span class="queue-status-pill ${pillClass}">${pillLabel}</span>
          ${detail ? `<div class="queue-status-detail">${detail}</div>` : ''}
        </td>
      </tr>`;
  }).join('');

  card.innerHTML = `
    <h2>🔍 תור ההוגנות</h2>
    <div class="card-sub">${introNote}</div>
    ${exclusionNote}
    ${summaryHtml}
    <div class="queue-table-wrap" style="overflow-x:auto; margin-top:14px;">
      <table class="queue-table">
        <thead><tr><th style="width:46px;">מקום</th><th>שם</th><th>תוצאה</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
  wrap.appendChild(card);
  return wrap;
}

function renderParashaModal(){
  const name = STATE.editingParasha;
  const split = getSplit(name);
  const backdrop = el(`<div class="modal-backdrop"></div>`);
  backdrop.innerHTML = `
    <div class="modal">
      <h3>עריכת חלוקת פסוקים — ${name}</h3>
      <div class="note">הזן/י את מספר הפסוקים בכל עלייה לפי החומש הנהוג בבית הכנסת.</div>
      <div class="parasha-edit-grid">
        ${split.map((n,i)=>`<div><label>${HEB_LETTERS[i]}</label><input type="number" min="3" data-idx="${i}" value="${n}"></div>`).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelP">ביטול</button>
        <button class="btn btn-gold" id="saveP">שמירה</button>
      </div>
    </div>
  `;
  setTimeout(()=>{
    backdrop.querySelector('#cancelP').onclick = ()=>{ STATE.editingParasha=null; render(); };
    backdrop.querySelector('#saveP').onclick = ()=>{
      const inputs = backdrop.querySelectorAll('input[data-idx]');
      const arr = new Array(7).fill(3);
      inputs.forEach(inp=>{ arr[parseInt(inp.dataset.idx)] = parseInt(inp.value)||3; });
      const baseline = getBaselineSplit(name);
      if(arraysEqual(arr, baseline)){
        // matches the verified/estimated baseline again - drop the override entirely
        delete STATE.parashot[name];
      } else {
        STATE.parashot[name] = arr;
      }
      saveParashot();
      STATE.editingParasha=null;
      render();
    };
  },0);
  return backdrop;
}

loadAll();
</script>
