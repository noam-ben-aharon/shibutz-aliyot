function buildSmartSelectOptions(parashaName, pesukim, aliyahIdx, assignedId, assignedAliyahOf, statsMap){
  const sorted = STATE.congregants.slice().sort((a,b)=>fairnessCompareStable(a, b, statsMap, parashaName));
  const bestFit = [];
  const strongClean = [];
  const recentFit = [];
  const outOfRange = [];
  const blocked = [];

  for(const c of sorted){
    const st = statsMap[c.id] || {total:0, lastEntry:null};
    const heldElsewhere = assignedAliyahOf[c.id] && assignedAliyahOf[c.id].some(k=>k!==aliyahIdx);
    const isIronBlocked = isRecencyBlocked(st, parashaName);
    const isRecentWarn = isRecencyWarning(st, parashaName);
    const isFit = fits(c, pesukim);
    const capText = c.unrestricted ? 'קורא חזק' : `עד ${c.level}`;
    const totalText = `${st.total} עליות`;

    let statusSuffix = '';
    if(heldElsewhere) statusSuffix = ' — משובץ לעלייה אחרת';
    else if(c.paused) statusSuffix = ' — מושהה';
    else if(isIronBlocked) statusSuffix = ` — קרא בפרשת ${st.lastEntry.parasha} (שבוע שעבר)`;
    else if(isRecentWarn) statusSuffix = ' — קרא לפני 2 שבתות';
    else if(!isFit) statusSuffix = pesukim > c.level ? ' — מעל הטווח' : ' — מתחת לטווח';

    const optHtml = `<option value="${c.id}" ${assignedId===c.id?'selected':''} ${heldElsewhere?'disabled':''}>${escHtml(c.name)} (${capText} · ${totalText})${statusSuffix}</option>`;

    if(heldElsewhere || c.paused || isIronBlocked){
      blocked.push(optHtml);
    } else if(c.unrestricted){
      if(isRecentWarn) recentFit.push(optHtml);
      else strongClean.push(optHtml);
    } else if(isFit){
      if(isRecentWarn) recentFit.push(optHtml);
      else bestFit.push(optHtml);
    } else {
      outOfRange.push(optHtml);
    }
  }

  const groups = [];
  if(bestFit.length) groups.push(`<optgroup label="✅ מתאימים ופנויים (לפי תור ההוגנות)">${bestFit.join('')}</optgroup>`);
  if(strongClean.length) groups.push(`<optgroup label="💪 קוראים חזקים פנויים (לפי התור)">${strongClean.join('')}</optgroup>`);
  if(recentFit.length) groups.push(`<optgroup label="⏱ מתאימים אך קראו לפני 2 שבתות">${recentFit.join('')}</optgroup>`);
  if(outOfRange.length) groups.push(`<optgroup label="↕️ מחוץ לטווח הפסוקים של העלייה">${outOfRange.join('')}</optgroup>`);
  if(blocked.length) groups.push(`<optgroup label="⛔ חסומים השבוע (שבוע שעבר / מושהים / משובצים)">${blocked.join('')}</optgroup>`);
  return groups.join('');
}

function buildWeekPanels(parashaName, assignObj, reasons, recencyWarnings, opts){
  reasons = reasons || {};
  recencyWarnings = recencyWarnings || {};
  opts = opts || {};
  const isLockMode = !!opts.isLockMode;
  const allowSuggest = !!opts.allowSuggest;
  const locks = opts.locks || {};
  const waSent = opts.waSent || {};
  const split = getSplit(parashaName);
  const statsMap = buildStatsMap();
  // which aliyah number(s) each (non-guest) person currently holds this week -
  // used to fully block picking them anywhere else, not just warn about it
  const assignedAliyahOf = {};
  for(let k=1;k<=7;k++){
    const v = assignObj[k] || assignObj[String(k)];
    if(v && !v.startsWith('guest:')) (assignedAliyahOf[v] = assignedAliyahOf[v]||[]).push(k);
  }
  let html = '';
  for(let i=1;i<=7;i++){
    const pesukim = split[i-1];
    const assignedId = assignObj[i] || assignObj[String(i)] || '';
    const isGuest = assignedId.startsWith && assignedId.startsWith('guest:');
    const guestName = isGuest ? assignedId.slice(6) : '';
    const person = isGuest ? null : resolvePerson(assignedId);
    const isLockedSlot = !!(locks[i] || locks[String(i)]);
    const isSent = !!(waSent[i] || waSent[String(i)]);
    let mismatch = '';
    if(person && !fits(person, pesukim)){
      const lowerPct = (STATE.matchSettings && STATE.matchSettings.lower) || 80;
      const upperPct = (STATE.matchSettings && STATE.matchSettings.upper) || 110;
      const min = Math.round(person.level*(lowerPct/100)), max = Math.round(person.level*(upperPct/100));
      mismatch = pesukim > max
        ? `⚠ מעל היכולת (טווח מומלץ: ${min}–${max})`
        : `⚠ עלייה קלה מדי עבורו - "מבזבז" יכולת (טווח מומלץ: ${min}–${max})`;
    }
    const isDuplicate = assignedId && !isGuest && assignedAliyahOf[assignedId] && assignedAliyahOf[assignedId].length>1;
    const recencyNote = recencyWarnings[i] || recencyWarnings[String(i)] || '';
    const state = !assignedId ? 'empty' : (mismatch || isDuplicate || recencyNote) ? 'warning' : 'filled';
    const optionsHtml = buildSmartSelectOptions(parashaName, pesukim, i, assignedId, assignedAliyahOf, statsMap);
    html += `
      <div class="panel" data-state="${state}">
        ${isLockedSlot && !isLockMode ? `<div class="lock-badge" title="ננעל ידנית מראש">🔒 נעול מראש</div>` : ''}
        <div class="seal"><div class="heb-letter">${HEB_LETTERS[i-1]}</div></div>
        <div class="aliyah-name">עולה ${ALIYAH_NAMES[i-1]}</div>
        <div class="pesukim">${pesukim} פסוקים</div>
        <select data-aliyah="${i}">
          <option value="">${isLockMode ? '— ללא נעילה —' : '— לא שובץ —'}</option>
          ${optionsHtml}
          ${(person && person.isDeleted) ? `<option value="${escHtml(assignedId)}" selected>${escHtml(person.name)}</option>` : ''}
          <option value="guest" ${isGuest?'selected':''}>👤 אורח (שם מותאם)</option>
        </select>
        ${isGuest ? `<input type="text" data-guestname="${i}" placeholder="שם האורח" value="${escHtml(guestName)}" style="margin-top:6px;font-size:13px;padding:6px 8px;">` : ''}
        ${(!isLockMode && (allowSuggest || (person && !isGuest))) ? `<div class="panel-actions-row">
          ${allowSuggest ? `<button type="button" class="btn btn-outline btn-sm btn-suggest" data-suggest="${i}" title="הצע מתפלל מתאים אחר לפי תור ההוגנות">${assignedId ? '🔄 החלף באחר' : '✨ הצע מתפלל'}</button>` : ''}
          ${(person && !isGuest) ? (()=>{
            const link = whatsappLinkForPerson(person, parashaName, ALIYAH_NAMES[i-1]);
            return link
              ? `<a class="btn ${isSent ? 'btn-wa-sent' : 'btn-outline'} btn-sm" data-wasend="${i}" href="${link}" target="_blank">${isSent ? '✓ נשלח (שלח שוב)' : '📱 שלח לו'}</a>`
              : `<div class="mini" style="margin-top:4px;width:100%;">אין טלפון שמור</div>`;
          })() : ''}
        </div>` : ''}
        ${mismatch ? `<div class="mismatch">${mismatch}</div>`:''}
        ${isDuplicate ? `<div class="mismatch">⚠ מתפלל זה מופיע ביותר מעלייה אחת בנתונים - כדאי לתקן</div>`:''}
        ${recencyNote ? `<div class="mismatch">⏱ ${recencyNote}</div>`:''}
        ${(!assignedId && reasons[i]) ? `<div class="mismatch">ℹ ${reasons[i]}</div>`:''}
      </div>`;
  }
  return html;
}

function renderAssignTab(){
  const wrap = el(`<div></div>`);

  const lastConfirmedDate = STATE.weeklyLog.length
    ? STATE.weeklyLog.map(w=>w.date).filter(Boolean).sort().slice(-1)[0]
    : null;
  if(lastConfirmedDate){
    const daysSince = Math.floor((new Date() - new Date(lastConfirmedDate)) / (1000*60*60*24));
    if(daysSince > 8){
      const reminder = el(`<div class="card" style="border-color:var(--warn);"></div>`);
      reminder.innerHTML = `<div class="note" style="color:var(--warn);font-weight:700;">⏰ עברו ${daysSince} ימים מאז השיבוץ האחרון שאושר (${formatDate(lastConfirmedDate)}) — כדאי לבצע שיבוץ לשבת הקרובה.</div>`;
      wrap.appendChild(reminder);
    }
  } else if(STATE.loaded){
    const reminder = el(`<div class="card" style="border-color:var(--warn);"></div>`);
    reminder.innerHTML = `<div class="note" style="color:var(--warn);font-weight:700;">⏰ עדיין לא בוצע שום שיבוץ מאושר. כדאי לבצע שיבוץ לשבת הקרובה.</div>`;
    wrap.appendChild(reminder);
  }

  const card = el(`<div class="card"></div>`);

  const yearSchedule = getActiveParashotForCurrentYear();
  const activeParashaNames = new Set(yearSchedule.activeList.map(p=>p[0]));
  const suggestionValid = STATE.suggestedParasha && PARASHOT_DEFAULT_TOTALS.some(p=>p[0]===STATE.suggestedParasha.name);
  const calendarOk = STATE.calendarStatus==='ok' && suggestionValid;
  const fallbackName = suggestionValid ? STATE.suggestedParasha.name : yearSchedule.activeList[0][0];
  let effectiveParasha = STATE.current ? STATE.current.parasha : (STATE.pendingParasha || fallbackName);
  // If no draft is open and the pending/default parasha isn't active this year, snap to an active one
  if(!STATE.current && !activeParashaNames.has(effectiveParasha)){
    effectiveParasha = fallbackName;
  }
  const effectiveDate = STATE.current ? STATE.current.date
    : calendarOk ? getDateForParasha(effectiveParasha)
    : (STATE.pendingDate || nextSaturdayISO());

  let calendarNote;
  if(STATE.calendarStatus==='loading'){
    calendarNote = `<div class="note">🔄 טוען את הלוח העברי...</div>`;
  } else if(!calendarOk){

  }

    ? `שנה מעוברת${yearSchedule.hebYear ? ` (${yearSchedule.hebYear})` : ''} — הפרשות נקראות בנפרד`
    : `שנה פשוטה${yearSchedule.hebYear ? ` (${yearSchedule.hebYear})` : ''} — פרשות מחוברות מותאמות אוטומטית`;

  // Ensure if an open draft has a parasha from `otherList`, it is still selectable
  const optionsList = activeParashaNames.has(effectiveParasha)
    ? yearSchedule.activeList
    : [...yearSchedule.activeList, [effectiveParasha, 0]];

  card.innerHTML = `<h2><span>בחירת פרשת השבוע</span><span class="pill pill-gold" style="font-family:'Assistant',sans-serif;font-size:12px;">📅 ${yearBadgeText}</span></h2>

    <div class="row-flex">
      <div>
        <label>פרשה (מותאם אוטומטית לשנה הנוכחית)</label>
        <select id="parashaSelect">
          ${optionsList.map(p=>{
            const upcomingDate = calendarOk ? getDateForParasha(p[0]) : '';
            const hasExactHit = calendarOk && (STATE.parashaCalendar||[]).some(c=>c.name===p[0] && c.date>=new Date().toISOString().slice(0,10));
            const dateSuffix = hasExactHit ? ` (${formatDate(upcomingDate)})` : '';
            return `<option value="${p[0]}" ${effectiveParasha===p[0] ? 'selected':''}>${p[0]}${dateSuffix}</option>`;

      <div>

      </div>
      <div style="flex:0 0 auto;">

  if(!STATE.current){

    }

    const lockPanels = buildWeekPanels(effectiveParasha, STATE.pendingLocks, null, null, { isLockMode: true });
    const lockCard = el(`<div class="card"></div>`);
    lockCard.innerHTML = `<h2>נעילת עלייה מסוימת (רשות)</h2>

      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
        <div><button class="btn btn-ink" id="confirmBtn">✓ אשר שיבוץ ועדכן היסטוריה</button></div>
        <div><button class="btn btn-outline" id="waGroupBtn">📱 שלח לקבוצה</button></div>
        <div><button class="btn btn-outline" id="copyTextBtn">📋 העתק כטקסט</button></div>
        <div><button class="btn btn-outline" id="printBtn">🖨️ הדפסה</button></div>
        <div><button class="btn btn-outline" id="showQueueBtn">🔍 למה זה ככה?</button></div>
        <div><button class="btn btn-outline" id="resetAssignBtn">איפוס עליות</button></div>
      </div>

          const num = sel.dataset.aliyah;

      });
      c2.querySelectorAll('a[data-wasend]').forEach(a=>{
        a.onclick = ()=>{
          const num = a.dataset.wasend;
          if(!STATE.current.waSent) STATE.current.waSent = {};
          STATE.current.waSent[num] = true;
          saveCurrent();
          setTimeout(()=>render(), 150);
        };
      });
      c2.querySelectorAll('input[data-guestname]').forEach(inp=>{
        inp.onchange = ()=>{
          const num = inp.dataset.guestname;
          STATE.current.assign[num] = 'guest:' + inp.value.trim();
          saveCurrent();
          render();
        };
      });
      c2.querySelector('#confirmBtn').onclick = confirmAssignment;
      c2.querySelector('#waGroupBtn').onclick = ()=> window.open(whatsappGroupShareLink(buildWeekText(STATE.current.parasha, STATE.current.date, STATE.current.assign)), '_blank');
      c2.querySelector('#copyTextBtn').onclick = ()=> copyWeekText(STATE.current.parasha, STATE.current.date, STATE.current.assign);
      c2.querySelector('#printBtn').onclick = ()=> printWeek(STATE.current.parasha, STATE.current.date, STATE.current.assign);
      c2.querySelector('#resetAssignBtn').onclick = ()=>{
        STATE.current.assign = {};
        STATE.current.locks = {};
        STATE.current.waSent = {};
        STATE.current.deferred = [];
        STATE.current.unfilledReasons = {};
        STATE.current.recencyWarnings = {};
        saveCurrent();
        render();
      };
    },0);
  }

  setTimeout(()=>{
    document.getElementById('parashaSelect').onchange = (e)=>{

        saveCurrent();

      render();
    };
  },0);

  return wrap;
}

// shared between the desktop table and the mobile card list, so the two views can never drift
function lastReadCellFor(c, stats){
  const last = stats.lastEntry;
  if(last) return `<b>${last.date ? formatDate(last.date) : 'תאריך לא ידוע'}</b> · ${last.parasha}, עולה ${ALIYAH_NAMES[last.aliyah-1]}`;
  if(c.baseTotal>0) return 'תאריך מדויק לא תועד';
  return 'טרם עלה';
}
// shared threshold used by the people-tab pill, its spread indicator, and the fairness tab's
// ranking chart - kept in one place so the views can never disagree about who counts as
// "flagged". Strong readers are included on the same footing as everyone else (they're full
// participants in real assignment - see runAssignment's strong-reader fallback), so they can be
// flagged too if their count runs far above/below the group average.
function fairnessFlagDirection(c, stats, avgNormal, normalCount){
  if(avgNormal<=0 || normalCount<=3) return null;
  if(stats.total >= avgNormal*1.8) return 'high';
  if(stats.total <= avgNormal*0.4 && stats.total < avgNormal-3) return 'low';
  return null;
}
function imbalanceFlagFor(c, stats, avgNormal, normalCount){
  const dir = fairnessFlagDirection(c, stats, avgNormal, normalCount);
  if(dir==='high') return ` <span class="pill pill-warn" title="משמעותית מעל הממוצע (${avgNormal.toFixed(1)})">⚠ מעל הממוצע</span>`;
  if(dir==='low') return ` <span class="pill pill-warn" title="משמעותית מתחת לממוצע (${avgNormal.toFixed(1)})">⚠ מתחת לממוצע</span>`;
  return '';
}

function renderPeopleTab(){
  const wrap = el(`<div></div>`);
  const card = el(`<div class="card"></div>`);

  const rowsWithStats = STATE.congregants.map(c=>({c, stats:getCongStats(c.id)}));

  // average total across everyone active (including strong readers - they're full participants
  // in real assignment now, see runAssignment), used to flag anyone significantly above/below
  // the group - a sign that the % tolerance (or the strong-reader minimum) may be creating a
  // bottleneck (e.g. only one person's range covers a common aliyah length)
  const normalTotals = rowsWithStats.filter(r=>!r.c.paused).map(r=>r.stats.total);
  const avgNormal = normalTotals.length ? normalTotals.reduce((a,b)=>a+b,0)/normalTotals.length : 0;

  // fairness spread among the active rotation (everyone non-paused) - the live version of the
  // diagnostic that used to require a manual Node simulation to check (see handoff doc section 6.2)
  const activeNormal = rowsWithStats.filter(r=>!r.c.paused);
  let spreadHtml = '';
  if(activeNormal.length>1){
    const maxRow = activeNormal.reduce((a,b)=>a.stats.total>=b.stats.total?a:b);
    const minRow = activeNormal.reduce((a,b)=>a.stats.total<=b.stats.total?a:b);
    const spread = maxRow.stats.total - minRow.stats.total;
    spreadHtml = `<div class="stat-pill-row"><div class="stat-tile">📊 פער הוגנות: ${spread} עליות (מקסימום: ${maxRow.c.name} — ${maxRow.stats.total}; מינימום: ${minRow.c.name} — ${minRow.stats.total})</div></div>`;
  }

  if(STATE.peopleSortMode==='stale'){
    rowsWithStats.sort((a,b)=>{
      const da = a.stats.lastEntry ? a.stats.lastEntry.date : '';
      const db = b.stats.lastEntry ? b.stats.lastEntry.date : '';
      return da.localeCompare(db); // never-read ('') sorts first, then oldest date first

  } else {
    rowsWithStats.sort((a,b)=>a.c.name.localeCompare(b.c.name,'he'));

  const query = (STATE.peopleSearch||'').trim();
  let filtered = query ? rowsWithStats.filter(r=>r.c.name.includes(query)) : rowsWithStats;
  if(STATE.peopleFilter==='paused') filtered = filtered.filter(r=>r.c.paused);
  else if(STATE.peopleFilter==='strong') filtered = filtered.filter(r=>r.c.unrestricted);

  const filterChip = (mode, label) =>
    `<button class="btn btn-sm ${STATE.peopleFilter===mode?'btn-ink':'btn-outline'}" data-filter="${mode}" type="button">${label}</button>`;

  card.innerHTML = `
    <h2>מתפללים</h2>
    <div style="margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-gold btn-sm" id="addPersonBtn">+ הוסף מתפלל</button>
      <button class="btn btn-outline btn-sm" id="exportBackupBtn">⬇ ייצוא גיבוי</button>
      <button class="btn btn-outline btn-sm" id="exportCsvBtn">📊 ייצוא היסטוריה ל-CSV</button>

      <button class="btn btn-outline btn-sm" id="importCsvBtn">⬆ ייבוא רשימה מ-CSV</button>

    </div>
    <div class="note">מומלץ לייצא גיבוי מדי פעם — כל המידע (מתפללים, היסטוריה, פרשות מותאמות) נשמר רק בדפדפן הזה, ועלול ללכת לאיבוד אם ינוקו נתוני הדפדפן או יוחלף המכשיר.</div>
    <div class="note">ייבוא CSV: שורת כותרת ואז שם,טווח פסוקים,טלפון בכל שורה ("חזק" בעמודת הטווח מסמן קורא חזק). מתפלל עם שם זהה לקיים יתעדכן, שם חדש יתווסף.</div>

    document.getElementById('addPersonBtn').onclick = ()=>{ STATE.editingCongregant='new'; render(); };
    document.getElementById('exportBackupBtn').onclick = exportBackup;
    document.getElementById('exportCsvBtn').onclick = exportHistoryCsv;
    document.getElementById('importBackupBtn').onclick = ()=>{ document.getElementById('importFileInput').click(); };
    document.getElementById('importFileInput').onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          importBackup(JSON.parse(reader.result));
          notice('הגיבוי יובא בהצלחה.');
        }catch(err){
          notice('קובץ הגיבוי לא תקין - הייבוא נכשל.');
        }
      };
      reader.readAsText(file);
    };
    document.getElementById('importCsvBtn').onclick = ()=>{ document.getElementById('importCsvFileInput').click(); };
    document.getElementById('importCsvFileInput').onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        const parsed = parseCongregantsCsv(String(reader.result));
        if(parsed.toAdd.length===0 && parsed.toUpdate.length===0){
          notice('לא נמצאו שורות תקינות בקובץ.');
          return;
        }
        const skippedNote = parsed.skipped ? ` (${parsed.skipped} שורות ללא שם דולגו)` : '';
        askConfirm(`נמצאו ${parsed.toAdd.length} מתפללים חדשים ו-${parsed.toUpdate.length} עדכונים למתפללים קיימים${skippedNote}. לבצע את הייבוא?`, ()=>{
          applyCongregantsCsv(parsed);
          render();
          notice('הייבוא הושלם.');
        });
      };
      reader.readAsText(file);
      e.target.value = '';
    };
    document.getElementById('sortByName').onclick = ()=>{ STATE.peopleSortMode='name'; render(); };
    document.getElementById('sortByStale').onclick = ()=>{ STATE.peopleSortMode='stale'; render(); };
    document.getElementById('peopleSearchInput').oninput = (e)=>{ STATE.peopleSearch = e.target.value; render(); };
    wrap.querySelectorAll('[data-filter]').forEach(b=> b.onclick = ()=>{ STATE.peopleFilter = b.dataset.filter; render(); });
    wrap.querySelectorAll('[data-history]').forEach(b=> b.onclick = ()=>{ STATE.viewingHistory = b.dataset.history; render(); });
    wrap.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=>{ STATE.editingCongregant = b.dataset.edit; render(); });
    wrap.querySelectorAll('[data-pause]').forEach(b=> b.onclick = ()=>{
      const p = STATE.congregants.find(c=>c.id===b.dataset.pause);
      if(p){ p.paused = !p.paused; saveCongregants(); render(); }
    });
    wrap.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=>{
      askConfirm('למחוק את המתפלל? הפעולה אינה הפיכה.', ()=>{
        deleteCongregantById(b.dataset.del);
        render();
      });
    });
  },0);
  return wrap;
}

function renderCongregantModal(){
  const isNew = STATE.editingCongregant==='new';
  const person = isNew ? {name:'',level:20,baseTotal:0,unrestricted:false,phone:''} : STATE.congregants.find(c=>c.id===STATE.editingCongregant);
  const backdrop = el(`<div class="modal-backdrop"></div>`);
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${isNew?'הוספת מתפלל':'עריכת מתפלל'}</h3>
      <div class="field"><label>שם מלא</label><input type="text" id="f-name" value="${escHtml(person.name)}"></div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;font-weight:700;">
          <input type="checkbox" id="f-unrestricted" style="width:auto;" ${person.unrestricted?'checked':''}>
          קורא חזק (ללא הגבלת טווח — תמיד יקבל את העלייה הארוכה ביותר שנותרה)
        </label>
      </div>
      <div class="field" id="levelField" style="${person.unrestricted?'display:none;':''}">
        <label>טווח פסוקים מקסימלי (יכולת)</label>
        <input type="number" id="f-level" value="${person.level}" min="3">
        <div class="note">המתפלל יקבל רק עליות בטווח ${STATE.matchSettings.lower}%–${STATE.matchSettings.upper}% מהמספר הזה.</div>
      </div>
      <div class="field">
        <label>מספר טלפון (רשות - לשליחת וואטסאפ)</label>
        <input type="text" id="f-phone" value="${escHtml(person.phone||'')}" placeholder="050-1234567" dir="ltr" style="text-align:left;">
        <button type="button" class="btn btn-outline btn-sm" id="pickContactBtn" style="margin-top:8px;width:100%;">📇 בחר מאנשי קשר</button>
      </div>
      ${isNew ? `
      <div class="note">אופציונלי: אם ידוע לך על עלייה אחרונה ספציפית (כולל תאריך), אפשר לתעד אותה כאן — היא תופיע בהיסטוריה שלו.</div>
      <div class="row-flex">
        <div class="field"><label>תאריך</label><input type="date" id="f-lastDate"></div>
        <div class="field"><label>פרשה</label>
          <select id="f-lastParasha">
            <option value="">— אין —</option>
            ${PARASHOT_DEFAULT_TOTALS.map(p=>`<option value="${p[0]}">${p[0]}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>עלייה</label>
          <select id="f-lastAliyah">
            <option value="">—</option>
            ${ALIYAH_NAMES.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('')}
          </select>
        </div>
      </div>` : ''}
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelModal">ביטול</button>
        <button class="btn btn-gold" id="saveModal">שמירה</button>
      </div>
    </div>
  `;
  setTimeout(()=>{
    backdrop.querySelector('#f-unrestricted').onchange = (e)=>{
      backdrop.querySelector('#levelField').style.display = e.target.checked ? 'none' : '';
    };
    backdrop.querySelector('#pickContactBtn').onclick = async ()=>{
      if(!('contacts' in navigator && 'ContactsManager' in window)){
        notice('בחירה מאנשי קשר לא נתמכת בדפדפן/במכשיר הזה (עובד בעיקר בכרום באנדרואיד) - אפשר להזין את המספר ידנית בשדה.');
        return;
      }
      try{
        const contacts = await navigator.contacts.select(['name','tel'], {multiple:false});
        if(contacts && contacts.length){
          const c = contacts[0];
          if(c.tel && c.tel.length) document.getElementById('f-phone').value = c.tel[0];
          const nameField = document.getElementById('f-name');
          if(c.name && c.name.length && !nameField.value.trim()) nameField.value = c.name[0];
        }
      }catch(e){
        // user cancelled the picker - nothing to do
      }
    };
    backdrop.querySelector('#cancelModal').onclick = ()=>{ STATE.editingCongregant=null; render(); };
    backdrop.querySelector('#saveModal').onclick = ()=>{
      const name = document.getElementById('f-name').value.trim();
      const unrestricted = document.getElementById('f-unrestricted').checked;
      const parsedLvl = parseInt(document.getElementById('f-level').value, 10);
      const level = unrestricted ? 100 : Math.max(3, (isNaN(parsedLvl) || parsedLvl <= 0) ? 20 : parsedLvl);
      const phone = document.getElementById('f-phone').value.trim();
      if(!name){ notice('יש להזין שם'); return; }
      if(isNew){
        const newId = 'c'+Math.random().toString(36).slice(2,9);
        STATE.congregants.push({ id:newId, name, level, baseTotal:0, unrestricted, phone });
        const lastParasha = document.getElementById('f-lastParasha').value;
        const lastAliyah = document.getElementById('f-lastAliyah').value;
        const lastDate = document.getElementById('f-lastDate').value;
        if(lastParasha && lastAliyah){
          STATE.weeklyLog.push({
            id: genId(),
            date: lastDate || '',
            parasha: lastParasha,
            assign: { [lastAliyah]: newId },
            deferred: []
          });
          saveWeeklyLog();
        }
      }else{
        const p = STATE.congregants.find(c=>c.id===STATE.editingCongregant);
        p.name=name; p.level=level; p.unrestricted=unrestricted; p.phone=phone;
        // baseTotal is intentionally left untouched here - total reads come only from
        // actual weeklyLog entries (past-week backfill or ongoing confirmed assignments)
      }
      saveCongregants();
      STATE.editingCongregant=null;
      render();
    };
  },0);
  return backdrop;
}

function renderManualWeekModal(){
  const draft = STATE.manualWeekDraft;
  const backdrop = el(`<div class="modal-backdrop"></div>`);
  const panels = buildWeekPanels(draft.parasha, draft.assign);
  backdrop.innerHTML = `
    <div class="modal" style="max-width:640px;">
      <h3>הוספת שבת עבר</h3>
      <div class="note">למילוי שבת שכבר התקיימה לפני תחילת השימוש באתר — כדי שהסבב ההוגן ייקח אותה בחשבון.</div>
      <div class="row-flex" style="margin-top:10px;">
        <div class="field">
          <label>פרשה</label>
          <select id="mw-parasha">
            ${PARASHOT_DEFAULT_TOTALS.map(p=>`<option value="${p[0]}" ${draft.parasha===p[0]?'selected':''}>${p[0]}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>תאריך</label>
          <input type="date" id="mw-date" value="${draft.date}">
        </div>
      </div>
      <div class="week-strip">${panels}</div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="mw-cancel">ביטול</button>
        <button class="btn btn-gold" id="mw-save">שמירה</button>
      </div>
    </div>
  `;
  setTimeout(()=>{
    backdrop.querySelector('#mw-parasha').onchange = (e)=>{
      draft.parasha = e.target.value;
      const pastDate = getPastDateForParasha(draft.parasha);
      if(pastDate) draft.date = pastDate;
      render();
    };
    backdrop.querySelector('#mw-date').onchange = (e)=>{ draft.date = e.target.value; };
    backdrop.querySelectorAll('select[data-aliyah]').forEach(sel=>{
      sel.onchange = ()=>{
        const num = sel.dataset.aliyah;
        const val = sel.value;
        if(val==='guest') draft.assign[num] = 'guest:';
        else if(val) draft.assign[num] = val;
        else delete draft.assign[num];
        render();
      };
    });
    backdrop.querySelectorAll('input[data-guestname]').forEach(inp=>{
      inp.onchange = ()=>{
        draft.assign[inp.dataset.guestname] = 'guest:' + inp.value.trim();
        render();
      };
    });
    backdrop.querySelector('#mw-cancel').onclick = ()=>{ STATE.manualWeekDraft=null; render(); };
    backdrop.querySelector('#mw-save').onclick = ()=>{
      const dateVal = backdrop.querySelector('#mw-date').value;
      if(!dateVal){ notice('יש להזין תאריך'); return; }
      const doSave = ()=>{
        STATE.weeklyLog.push({
          id: genId(),
          date: dateVal,
          parasha: draft.parasha,
          assign: {...draft.assign},
          deferred: []
        });
        saveWeeklyLog();
        STATE.manualWeekDraft = null;
        render();
      };
      const dup = STATE.weeklyLog.find(w=>w.parasha===draft.parasha && w.date===dateVal);
      if(dup){
        askConfirm(`הפרשה ${draft.parasha} כבר קיימת בהיסטוריה בתאריך ${formatDate(dateVal)}. האם לעדכן (הדריסה תחליף לגמרי את הרשומה הקיימת)?`, ()=>{
          STATE.weeklyLog = STATE.weeklyLog.filter(w=>w.id!==dup.id);
          doSave();
        });
        return;
      }
      doSave();
    };
  },0);
  return backdrop;
}

        return `<tr>
          <td class="name-cell">${p[0]}</td>
          <td class="mini">${p[1]}</td>
          <td class="mini">${split.join(' · ')}</td>
          <td><span class="pill ${status.cls}">${status.label}</span></td>
          <td class="mini">${diff}</td>
          <td><button class="btn btn-outline btn-sm" data-editp="${p[0]}">עריכה</button></td>
        </tr>`;
      }).join('')}
    </table>
  `;
  wrap.appendChild(card);
  setTimeout(()=>{
    wrap.querySelectorAll('[data-editp]').forEach(b=> b.onclick=()=>{ STATE.editingParasha=b.dataset.editp; render(); });
    document.getElementById('saveMatchSettings').onclick = ()=>{
      const rawLo = parseInt(document.getElementById('ms-lower').value, 10) || 65;
      const rawHi = parseInt(document.getElementById('ms-upper').value, 10) || 130;
      const lower = Math.max(10, Math.min(100, Math.min(rawLo, rawHi)));
      const upper = Math.max(lower + 5, Math.min(300, Math.max(rawLo, rawHi)));
      const rawStrong = parseInt(document.getElementById('ms-strongmin').value, 10);
      const strongMin = isNaN(rawStrong) ? 30 : Math.max(3, Math.min(200, rawStrong));
      STATE.matchSettings = {lower, upper, strongMin};
      saveMatchSettings();
      render();
    };
    document.getElementById('saveWaTemplate').onclick = ()=>{
      const val = document.getElementById('wa-template').value.trim();
      STATE.whatsappTemplate = val || DEFAULT_WHATSAPP_TEMPLATE;
      saveWhatsappTemplate();
      notice('התבנית נשמרה.');
    };
    document.getElementById('resetWaTemplate').onclick = ()=>{
      STATE.whatsappTemplate = null;
      saveWhatsappTemplate();
      render();
    };
  },0);
  return wrap;
}

// Only paused congregants are left out of the balance tab - everyone else (including strong
// readers, who are full participants in real assignment, see runAssignment) is included on the
// same footing, so the chart never shows fewer names than the people tab without saying why.
function excludedCongregantsNote(){
  const pausedCount = STATE.congregants.filter(c=>c.paused).length;
  if(!pausedCount) return '';
  return `<div class="note">לא נכנסים לחישוב הזה: ${pausedCount} מתפללים מושהים.</div>`;
}

function renderFairnessTab(){
  const wrap = el(`<div></div>`);
  const card = el(`<div class="card"></div>`);

  const statsMap = buildStatsMap();
  const activeNormal = STATE.congregants.filter(c=>!c.paused);
  const rows = activeNormal
    .map(c=>({c, stats: statsMap[c.id] || {total:0, lastEntry:null, history:[]}}))
    .sort((a,b)=>b.stats.total - a.stats.total);
  const exclusionNote = excludedCongregantsNote();

  if(rows.length < 2){
    card.innerHTML = `<h2>⚖️ מאזן ההוגנות</h2>
      <div class="empty-state"><div class="big">אין עדיין מספיק מתפללים פעילים</div>המאזן מוצג רק כשיש לפחות שני מתפללים שאינם מושהים.</div>`;
    wrap.appendChild(card);
    return wrap;
  }

  const totals = rows.map(r=>r.stats.total);
  const avg = totals.reduce((a,b)=>a+b,0)/totals.length;
  const max = Math.max(...totals);
  const min = Math.min(...totals);
  const spread = max - min;
  const noDataYet = max === 0;

  const flaggedCount = rows.filter(r=>fairnessFlagDirection(r.c, r.stats, avg, rows.length)).length;
  const statusClass = noDataYet ? '' : (flaggedCount===0 ? 'status-good' : 'status-warn');
  const statusText = noDataYet ? 'אין עדיין נתונים' : (flaggedCount===0 ? 'מאוזן היטב' : `${flaggedCount} מתפללים שכדאי לשים לב אליהם`);

  const barMax = Math.max(max, 1);
  const avgPct = (avg/barMax*100).toFixed(1);

  const rankRowsHtml = rows.map(({c, stats})=>{
    const dir = fairnessFlagDirection(c, stats, avg, rows.length);
    const fillClass = dir==='high' ? 'flag-high' : dir==='low' ? 'flag-low' : '';
    const pct = (stats.total/barMax*100).toFixed(1);
    return `
      <div class="rank-row">
        <div class="rank-name">${c.name}</div>
        <div class="rank-track"><div class="rank-fill ${fillClass}" style="width:${pct}%"></div></div>
        <div class="rank-value">${stats.total}</div>
      </div>`;
  }).join('');

  const lower0 = STATE.fairnessSimLower!=null ? STATE.fairnessSimLower : STATE.matchSettings.lower;
  const upper0 = STATE.fairnessSimUpper!=null ? STATE.fairnessSimUpper : STATE.matchSettings.upper;
  const isCurrentSettings = lower0===STATE.matchSettings.lower && upper0===STATE.matchSettings.upper;
  const currentFlex = computeFlexibilityScore(STATE.matchSettings.lower, STATE.matchSettings.upper);
  const simFlex = isCurrentSettings ? currentFlex : computeFlexibilityScore(lower0, upper0);
  const flexDelta = simFlex - currentFlex;

  card.innerHTML = `
    <h2>⚖️ מאזן ההוגנות</h2>
    <div class="card-sub">כמה מאוזנת חלוקת העליות בין כל המתפללים הפעילים (כולל קוראים חזקים), ולמה.</div>
    ${exclusionNote}
    <div class="fairness-hero">
      <div class="fairness-seal"><div class="fs-num">${spread}</div><div class="fs-label">פער</div></div>
      <div>
        <div class="fairness-status ${statusClass}">${statusText}</div>
        ${noDataYet ? '' : `<div class="fairness-status-sub">הכי הרבה: ${rows[0].c.name} (${max}) · הכי מעט: ${rows[rows.length-1].c.name} (${min}) · ממוצע ${avg.toFixed(1)}</div>`}
      </div>
    </div>
    <div style="position:relative;margin-top:12px;">
      <div style="position:absolute; inset-inline-start:150px; inset-inline-end:44px; top:0; bottom:0;">
        <div class="rank-avg-line" style="right:${avgPct}%;"></div>
      </div>
      ${rankRowsHtml}
    </div>
    <div class="sim-strip">
      <div class="sim-slide">
        <label>אחוז תחתון <span id="simLowerVal">${lower0}%</span></label>
        <input type="range" id="simLowerSlider" min="50" max="95" step="5" value="${lower0}">
      </div>
      <div class="sim-slide">
        <label>אחוז עליון <span id="simUpperVal">${upper0}%</span></label>
        <input type="range" id="simUpperSlider" min="105" max="150" step="5" value="${upper0}">
      </div>
      <div class="sim-readout">
        גמישות שיבוץ${isCurrentSettings ? ' (המצב הנוכחי)' : ''}: <b>${simFlex.toFixed(2)}</b>
        ${isCurrentSettings ? '' : (flexDelta>=0
          ? `<div style="color:var(--good);">▲ ${flexDelta.toFixed(2)} לעומת היום</div>`
          : `<div style="color:var(--warn);">▼ ${Math.abs(flexDelta).toFixed(2)} לעומת היום</div>`)}
      </div>
      ${isCurrentSettings ? '' : `<div><button class="btn btn-gold btn-sm" id="applySimBtn">החל בפועל בהגדרות ההתאמה</button></div>`}
    </div>
    <div class="note">"גמישות שיבוץ" = כמה מתפללים רגילים, בממוצע, יכולים לכסות כל עלייה נתונה בטווח הזה (נמדד על פני 61 הפרשות האמיתיות, באותה נוסחת ההתאמה שהאלגוריתם עצמו משתמש בה — לא הערכה נפרדת). ככל שהמספר גבוה יותר, יש לאלגוריתם יותר מקום לאזן, מה שבדרך כלל מצמצם את הפער בטווח הארוך.</div>
  `;
  wrap.appendChild(card);
  setTimeout(()=>{
    const lowerSlider = document.getElementById('simLowerSlider');
    const upperSlider = document.getElementById('simUpperSlider');
    const lowerLabel = document.getElementById('simLowerVal');
    const upperLabel = document.getElementById('simUpperVal');
    // 'input' fires continuously while dragging - only touch the text label here (cheap DOM
    // update, doesn't disturb the slider node itself). A full render() mid-drag would replace the
    // slider element and silently break the browser's native drag/pointer-capture on it (the same
    // class of bug fixed for the text search inputs elsewhere in this file). The real STATE update
    // + recompute only happens on 'change', which fires once per completed drag or key press.
    lowerSlider.oninput = ()=>{
      let v = +lowerSlider.value;
      if(v > +upperSlider.value - 15){ v = +upperSlider.value - 15; lowerSlider.value = v; }
      lowerLabel.textContent = v + '%';
    };
    upperSlider.oninput = ()=>{
      let v = +upperSlider.value;
      if(v < +lowerSlider.value + 15){ v = +lowerSlider.value + 15; upperSlider.value = v; }
      upperLabel.textContent = v + '%';
    };
    lowerSlider.onchange = ()=>{ STATE.fairnessSimLower = +lowerSlider.value; render(); };
    upperSlider.onchange = ()=>{ STATE.fairnessSimUpper = +upperSlider.value; render(); };
    const applyBtn = document.getElementById('applySimBtn');
    if(applyBtn) applyBtn.onclick = ()=>{
      const prevStrongMin = (STATE.matchSettings && STATE.matchSettings.strongMin != null) ? STATE.matchSettings.strongMin : 30;
      STATE.matchSettings = {lower:lower0, upper:upper0, strongMin:prevStrongMin};
      saveMatchSettings();
      STATE.fairnessSimLower = null;
      STATE.fairnessSimUpper = null;
      render();
      notice('טווח ההתאמה עודכן בפועל.');
    };
  },0);
  return wrap;
}

// Weeks that can be explained on the fairness-queue tab: the still-open draft (if any) plus the
// most recent confirmed weeks - newest first, matching how the pills read.
function renderQueueTab(){
  const wrap = el(`<div></div>`);
  const card = el(`<div class="card"></div>`);

  // strong readers ARE full participants in the real rotation (see runAssignment) - only paused
  // congregants sit out of it entirely, so only they're excluded from this table.
  const active = STATE.congregants.filter(c=>!c.paused);
  if(active.length===0){
    card.innerHTML = `<h2>🔍 תור ההוגנות</h2>
      <div class="empty-state"><div class="big">אין עדיין מתפללים פעילים</div>הטבלה מוצגת רק כשיש לפחות מתפלל אחד שאינו מושהה.</div>`;
    wrap.appendChild(card);
    return wrap;
  }

  const current = STATE.current;
  const liveStats = buildStatsMap();
  const refParasha = (current && current.parasha) || STATE.pendingParasha || (STATE.suggestedParasha && STATE.suggestedParasha.name) || null;
  const queue = active.slice().sort((a,b)=>fairnessCompareStable(a,b, liveStats, refParasha));
  const split = current ? getSplit(current.parasha) : null;

  const introNote = current
    ? `לפני שרצים שיבוץ, ההנחה הפשוטה היא שמקומות 1–7 בתור יקבלו את שבע העליות לפי הסדר. בפועל, טווח הפסוקים של כל אחד (או אין-טווח, אצל קוראים חזקים) קובע אם הוא באמת מתאים לעלייה שמגיעה אליו — מי שכן, מסומן ירוק ועובר לסוף התור; מי שלא, התור פשוט ממשיך למקום הבא (8, 9, וכן הלאה) עד שנמצא מישהו שמתאים. קוראים חזקים מקבלים עדיפות לעליות הארוכות ביותר, אבל אם השבת אין עלייה כזו הם עדיין משתבצים כרגיל.`
    : `זהו סדר העדיפות הנוכחי — מי שקרא הכי פחות פעמים נמצא ראשון, כולל קוראים חזקים. אחרי הרצת שיבוץ בטאב "שיבוץ השבוע", חוזרים לכאן ורואים בדיוק מי מהם התאים ומי לא, ולמה.`;

  const pausedCount = STATE.congregants.filter(c=>c.paused).length;
  const exclusionNote = pausedCount
    ? `<div class="note">לא מופיע כאן: ${pausedCount} מתפללים מושהים.</div>` : '';

  // a quick dashboard-style summary strip above the table - live numbers, not just a bare list
  const totals = queue.map(c=>(liveStats[c.id]||{total:0}).total);
  const spread = totals.length ? Math.max(...totals) - Math.min(...totals) : 0;
  const maxTotal = Math.max(1, ...totals);
  const statusTile = current
    ? `<div class="stat-tile">📝 טיוטה פתוחה: ${current.parasha} (${formatDate(current.date)})</div>`
    : `<div class="stat-tile">⏳ טרם הורץ שיבוץ לשבת הקרובה</div>`;
  const summaryHtml = `
    <div class="stat-pill-row">
      <div class="stat-tile">👥 ${queue.length} בתור</div>
      <div class="stat-tile">📊 פער נוכחי: ${spread} עליות</div>
      ${statusTile}
    </div>`;

  const rowsHtml = queue.map((c, idx)=>{
    const stats = liveStats[c.id] || {total:0, lastEntry:null};
    const total = stats.total;
    const info = current ? explainQueuePerson(c, current, split, liveStats) : null;
    let rowClass = '', pillClass = 'muted', pillLabel = 'טרם עלה', detail = '', actionBtnHtml = '';
    if(info){
      if(info.selected){
        rowClass = 'row-selected';
        pillClass = 'good';
        pillLabel = `✓ נבחר — ${ALIYAH_NAMES[info.aliyahNum-1]}`;
        detail = 'עובר לסוף התור' + (info.recencyWarning ? ` · ⏱ ${info.recencyWarning}` : '');
      } else {
        rowClass = 'row-skip';
        pillClass = info.actionable ? 'pending' : 'muted';
        pillLabel = info.actionable ? 'פנוי לשיבוץ ידני' : 'לא התאים';
        detail = info.reason;
        if(info.actionable && info.aliyahNum){
          actionBtnHtml = `<div style="margin-top:6px;"><button type="button" class="btn btn-gold btn-sm" data-quickassign-person="${c.id}" data-quickassign-aliyah="${info.aliyahNum}">➕ שבץ עכשיו לעלייה ${ALIYAH_NAMES[info.aliyahNum-1]}</button></div>`;
        }
      }
    } else if(stats.lastEntry){
      // idle state (no draft open yet): showing "ממתין" on all 23 rows said nothing - real,
      // differentiated info (when each person last actually read) is far more useful here.
      pillLabel = 'קרא בעבר';
      detail = `לאחרונה: ${formatDate(stats.lastEntry.date)} · פרשת ${stats.lastEntry.parasha}`;
    }
    const barPct = (total / maxTotal * 100).toFixed(1);
    const capPill = c.unrestricted ? `<span class="queue-cap-pill strong">קורא חזק</span>` : `<span class="queue-cap-pill">עד ${c.level} פס'</span>`;
    return `
      <tr class="${rowClass}" style="--i:${idx}">
        <td style="width:46px;"><div class="queue-rank-badge">${idx+1}</div></td>
        <td class="name-cell">
          <div class="queue-name-line"><b>${c.name}</b>${capPill}<span class="queue-total-pill">${total} עליות</span></div>
          <div class="queue-total-track"><div class="queue-total-fill" style="width:${barPct}%"></div></div>
        </td>
        <td class="queue-status-td">
          <span class="queue-status-pill ${pillClass}">${pillLabel}</span>
          ${detail ? `<div class="queue-status-detail">${detail}</div>` : ''}
          ${actionBtnHtml}
        </td>
      </tr>`;
  }).join('');

  card.innerHTML = `
    <h2>🔍 תור ההוגנות</h2>
    <div class="card-sub">${introNote}</div>
    ${exclusionNote}
    ${summaryHtml}
    <div class="queue-table-wrap" style="overflow-x:auto; margin-top:14px;">
      <table class="queue-table">
        <thead><tr><th style="width:46px;">מקום</th><th>שם</th><th>תוצאה</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
  wrap.appendChild(card);
  setTimeout(()=>{
    card.querySelectorAll('button[data-quickassign-person]').forEach(btn=>{
      btn.onclick = ()=>{
        if(!STATE.current) return;
        const pid = btn.dataset.quickassignPerson;
        const aliyahNum = btn.dataset.quickassignAliyah;
        updateDraftSlotAssignment(aliyahNum, pid);
        render();
        notice(`שובץ בהצלחה לעלייה ${ALIYAH_NAMES[parseInt(aliyahNum,10)-1]}!`);
      };
    });
  },0);
  return wrap;
}

function renderParashaModal(){
  const name = STATE.editingParasha;
  const split = getSplit(name);
  const backdrop = el(`<div class="modal-backdrop"></div>`);
  backdrop.innerHTML = `
    <div class="modal">
      <h3>עריכת חלוקת פסוקים — ${name}</h3>
      <div class="note">הזן/י את מספר הפסוקים בכל עלייה לפי החומש הנהוג בבית הכנסת.</div>
      <div class="parasha-edit-grid">
        ${split.map((n,i)=>`<div><label>${HEB_LETTERS[i]}</label><input type="number" min="3" data-idx="${i}" value="${n}"></div>`).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelP">ביטול</button>
        <button class="btn btn-gold" id="saveP">שמירה</button>
      </div>
    </div>
  `;
  setTimeout(()=>{
    backdrop.querySelector('#cancelP').onclick = ()=>{ STATE.editingParasha=null; render(); };
    backdrop.querySelector('#saveP').onclick = ()=>{
      const inputs = backdrop.querySelectorAll('input[data-idx]');
      const arr = new Array(7).fill(3);
      inputs.forEach(inp=>{
        const v = parseInt(inp.value, 10);
        arr[parseInt(inp.dataset.idx, 10)] = Math.max(3, (isNaN(v) || v <= 0) ? 3 : v);
      });
      const baseline = getBaselineSplit(name);
      if(arraysEqual(arr, baseline)){
        // matches the verified/estimated baseline again - drop the override entirely
        delete STATE.parashot[name];
      } else {
        STATE.parashot[name] = arr;
      }
      saveParashot();
      STATE.editingParasha=null;
      render();
    };
  },0);
  return backdrop;
}

loadAll();
